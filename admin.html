<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Saynam Back Office</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Lao:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<style>
/* Layout: fixed left rail of operations → growth → finance; working canvas on the right. Tape-chart calendar is the signature screen. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f5f8f6; --line:#d6dfdb; --line-2:#e6ece9;
  --fg:#13201c; --muted:#5a6a64; --faint:#8a9893;
  --accent:#0c6b61; --accent-2:#0a564f; --accent-soft:#d5ebe7; --accent-ink:#ffffff;
  --gold:#9a6a12; --gold-soft:#f6ecd8;
  --good:#2c7a47; --good-soft:#dcefe2; --warn:#a96b0c; --warn-soft:#f8ead2; --bad:#b03a2a; --bad-soft:#f6dcd7; --info:#2f5fb3; --info-soft:#dde7f7;
  --rail:#0f2a26; --rail-fg:#cfe3de; --rail-muted:#7fa39b; --rail-active:#1b4740;
  --c-DIR:#0c6b61; --c-FB:#3d63c9; --c-WALK:#6d7b74; --c-BKG:#1d3f87; --c-AGD:#c2511f; --c-EXP:#a77b0e; --c-TA:#7a4bb8;
  --f-display:"Bricolage Grotesque","Noto Sans Lao","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans Lao","Noto Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans Lao","Noto Sans Thai",ui-monospace,monospace;
  --r:10px; --shadow:0 1px 2px rgba(15,42,38,.06),0 4px 14px rgba(15,42,38,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1614; --surface:#14201d; --surface-2:#182724; --line:#273a35; --line-2:#1f302c;
  --fg:#e3ece9; --muted:#97aaa4; --faint:#6c807a;
  --accent:#4cb5a6; --accent-2:#6cc9bb; --accent-soft:#183a35; --accent-ink:#06201c;
  --gold:#d9a94e; --gold-soft:#3a2f18;
  --good:#5fc283; --good-soft:#173524; --warn:#e3a744; --warn-soft:#3a2c13; --bad:#e8735f; --bad-soft:#3d1d18; --info:#7ea4ec; --info-soft:#1b2a45;
  --rail:#091311; --rail-fg:#cfe3de; --rail-muted:#6e8e87; --rail-active:#173a34;
  --c-DIR:#2f9c8e; --c-FB:#5b80e0; --c-WALK:#7f8d86; --c-BKG:#4d6fbf; --c-AGD:#d86a3a; --c-EXP:#c49a2c; --c-TA:#9b6fd6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1614; --surface:#14201d; --surface-2:#182724; --line:#273a35; --line-2:#1f302c;
  --fg:#e3ece9; --muted:#97aaa4; --faint:#6c807a;
  --accent:#4cb5a6; --accent-2:#6cc9bb; --accent-soft:#183a35; --accent-ink:#06201c;
  --gold:#d9a94e; --gold-soft:#3a2f18;
  --good:#5fc283; --good-soft:#173524; --warn:#e3a744; --warn-soft:#3a2c13; --bad:#e8735f; --bad-soft:#3d1d18; --info:#7ea4ec; --info-soft:#1b2a45;
  --rail:#091311; --rail-fg:#cfe3de; --rail-muted:#6e8e87; --rail-active:#173a34;
  --c-DIR:#2f9c8e; --c-FB:#5b80e0; --c-WALK:#7f8d86; --c-BKG:#4d6fbf; --c-AGD:#d86a3a; --c-EXP:#c49a2c; --c-TA:#9b6fd6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tnum,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--rail);color:var(--rail-fg);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(160deg,#1f8a7c,#0c5a52);display:grid;place-items:center;flex:none}
.brand-mark svg{display:block}
.brand b{font-family:var(--f-display);font-size:15px;line-height:1.2;display:block;color:#f2f8f6}
.brand span{font-size:11.5px;color:var(--rail-muted)}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp>small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-muted);padding:0 10px 4px}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--rail-fg);text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;line-height:1.35}
.navbtn svg{flex:none;opacity:.8}
.navbtn:hover{background:rgba(255,255,255,.05)}
.navbtn.on{background:var(--rail-active);color:#fff;box-shadow:inset 3px 0 0 #4cb5a6}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--rail-muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.demo-tag{display:inline-block;align-self:flex-start;border:1px dashed var(--rail-muted);border-radius:6px;padding:2px 8px;color:var(--rail-fg)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,24px);padding-right:max(16px,env(safe-area-inset-right,0px),24px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:700;margin-right:auto}
.chip-date{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px}
.chip-date b{font-family:var(--f-mono);font-weight:500}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.langs button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.langs button.on{background:var(--accent);color:var(--accent-ink)}
#view{padding-block:22px 48px;padding-left:max(16px,24px);padding-right:max(16px,env(safe-area-inset-right,0px),24px);display:flex;flex-direction:column;gap:18px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.pri:hover{background:var(--accent-2)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip-date .btn{border-radius:999px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card>h3{font-size:14.5px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.card>h3 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi label{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi.lead .v{color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:500;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-pending{background:var(--warn-soft);color:var(--warn)} .p-confirmed{background:var(--info-soft);color:var(--info)} .p-inhouse{background:var(--good-soft);color:var(--good)}
.p-out{background:var(--surface-2);color:var(--muted)} .p-cancelled,.p-noshow{background:var(--bad-soft);color:var(--bad)}
.h-clean{background:var(--info-soft);color:var(--info)} .h-inspected{background:var(--good-soft);color:var(--good)}
.h-dirty{background:var(--warn-soft);color:var(--warn)} .h-ooo{background:var(--bad-soft);color:var(--bad)}
.chdot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.chname{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

.tablewrap{overflow-x:auto;min-width:0}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
table.t tr.sub td{font-weight:600;background:var(--surface-2)}
table.t tr.hd td{font-weight:600;color:var(--accent);padding-top:14px;border-bottom:1px solid var(--line)}
table.t tr.tot td{font-weight:700;border-top:1px solid var(--fg);border-bottom:3px double var(--fg)}
table.t td.ind{padding-left:26px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)} .warnc{color:var(--warn)}
.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1 1 220px;min-width:0}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:9px 12px}
.note.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.note.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.note.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.empty{color:var(--faint);font-size:13px;padding:10px 0}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li .who{flex:1;min-width:0}
.li .who b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .who span{font-size:12px;color:var(--muted)}
.roomno{font-family:var(--f-mono);font-weight:500;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;flex:none}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.stackbar span{display:block;height:100%}
.mixlist{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;font-size:13px;margin-top:12px;align-items:center}

/* tape chart */
.tape{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tape-inner{min-width:900px}
.trow{display:grid;grid-template-columns:104px repeat(14,minmax(56px,1fr));position:relative}
.trow>*{grid-row:1}
.thead{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line)}
.thead .dcell{padding:6px 4px;text-align:center;font-size:11.5px;line-height:1.25;color:var(--muted);border-left:1px solid var(--line-2)}
.thead .dcell b{display:block;font-family:var(--f-mono);font-weight:500;color:var(--fg);font-size:12.5px}
.thead .dcell.today{background:var(--accent-soft);color:var(--accent)}
.thead .dcell.today b{color:var(--accent)}
.thead .dcell.we{background:var(--surface-2)}
.rlabel{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:12px;border-bottom:1px solid var(--line-2)}
.rlabel b{font-family:var(--f-mono);font-weight:500;font-size:13px}
.rlabel span{color:var(--faint);font-size:11px}
.hkdot{width:8px;height:8px;border-radius:50%;flex:none}
.hkdot.clean{background:var(--info)} .hkdot.inspected{background:var(--good)} .hkdot.dirty{background:var(--warn)} .hkdot.ooo{background:var(--bad)}
.tcell{border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2);min-height:38px;cursor:pointer;background:transparent}
.tcell.we{background:var(--surface-2)}
.tcell.today{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.tcell.past{cursor:default}
.tcell:not(.past):hover{background:var(--accent-soft)}
.tcell.ooo{background:repeating-linear-gradient(135deg,var(--bad-soft) 0 6px,transparent 6px 12px);cursor:not-allowed}
.bar{z-index:1;align-self:center;margin:0 3px;height:28px;border-radius:6px;color:#fff;font-size:11.5px;line-height:28px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.bar.confirmed{opacity:.92;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 5px,transparent 5px 10px)}
.bar.out{opacity:.45}
.bar.pending{opacity:.75;outline:2px dashed var(--warn);outline-offset:-2px}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.bar:hover{filter:brightness(1.08)}

/* rooms */
.floor{display:flex;flex-direction:column;gap:10px}
.floor h4{margin:0;font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--line)}
.rcard.clean{border-top-color:var(--info)} .rcard.inspected{border-top-color:var(--good)} .rcard.dirty{border-top-color:var(--warn)} .rcard.ooo{border-top-color:var(--bad)}
.rcard .rn{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1}
.rcard .occ{font-size:12.5px;min-height:38px}
.rcard .occ b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-size:11px;padding:2px 7px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* booking site preview */
.eng{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px;align-items:start}
.phone{background:#f7f3ea;color:#2a2418;border-radius:22px;border:8px solid #1b2422;box-shadow:var(--shadow);overflow:hidden;font-size:13.5px}
.phone *{border-color:#e2d9c6}
.ph-hero{background:linear-gradient(170deg,#0f3d37 0%,#145a50 60%,#1c6c5f 100%);color:#f4efe2;padding:22px 18px 18px;position:relative;overflow:hidden}
.ph-hero h2{font-size:21px;color:#fff8e8;margin-bottom:4px}
.ph-hero p{margin:0;font-size:12.5px;opacity:.85}
.ph-hero .waves{position:absolute;right:-10px;bottom:-6px;opacity:.25}
.ph-body{padding:14px 14px 18px;display:flex;flex-direction:column;gap:12px}
.ph-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;border:1px solid #e2d9c6;border-radius:12px;padding:10px}
.ph-form label{font-size:11px;color:#7a6f5a;display:flex;flex-direction:column;gap:3px}
.ph-form input,.ph-form select{border:1px solid #e2d9c6;border-radius:8px;padding:6px 8px;background:#fffdf8;color:#2a2418;min-width:0;width:100%}
.ph-form .full{grid-column:1/-1}
.ph-btn{background:#b9852a;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;width:100%}
.ph-btn:hover{background:#a5761f}
.ph-btn.alt{background:transparent;color:#145a50;border:1px solid #145a50}
.ph-room{background:#fff;border:1px solid #e2d9c6;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ph-room .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ph-room h5{margin:0;font-size:14px;font-family:var(--f-display)}
.ph-price{font-family:var(--f-display);font-size:18px;font-weight:700;color:#145a50;white-space:nowrap}
.ph-strike{text-decoration:line-through;color:#9a8f7a;font-size:12px;white-space:nowrap}
.ph-save{background:#e9f2ea;color:#2c6b3c;border-radius:999px;font-size:11px;padding:1px 8px;font-weight:600}
.ph-room .ph-btn{padding:7px 12px;width:auto;align-self:flex-end}
.ph-muted{color:#7a6f5a;font-size:12px}
.ph-sum{background:#fff;border:1px solid #e2d9c6;border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.ph-sum .t{font-weight:700;border-top:1px solid #e2d9c6;padding-top:6px;margin-top:4px}
.ph-qr{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:1px solid #e2d9c6;border-radius:12px;padding:14px}
.ph-qr canvas{width:168px;height:168px;image-rendering:pixelated}
.ph-ok{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px}
.ph-ok .tick{width:52px;height:52px;border-radius:50%;background:#e9f2ea;display:grid;place-items:center}

/* modal */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal .scrim{position:absolute;inset:0;background:rgba(8,20,18,.45)}

      threadSeen: id => LIVE ? rpc('member_thread_seen', { p_thread: id }) : demoRun(() => Core.memberThreadSeen(demoMember(), id)),
      review: (code, p) => LIVE ? rpc('member_review', { p_code: code, p_rating: p.rating, p_clean: p.r_clean || null, p_service: p.r_service || null, p_location: p.r_location || null, p_value: p.r_value || null, p_title: p.title || null, p_body: p.body || null })
        : demoRun(() => Core.memberReview(demoMember(), code, p)),
      notifRead: ids => LIVE ? rpc('member_notifications_read', { p_ids: ids || null }) : demoRun(() => Core.memberNotifRead(demoMember(), ids || null)),
      // the current password is checked by signing in again before the new one is set
      async changePassword(current, next) {

        const c = await client(); const { data } = await c.auth.getSession(); const email = data.session && data.session.user.email;
        if (!email) throw toErr('login_required');

    // guest slip: live mode stores it in the private 'slips' bucket under the booking code; demo keeps a small data URL
    async uploadSlip(code, blob) {
      if (!LIVE) return await blobToDataURL(blob);

    async openSlip(cid) {

    async uploadQr(blob, type) {
      if (!LIVE) return await blobToDataURL(blob);
      const c = await client(), ext = type === 'image/png' ? 'png' : type === 'image/webp' ? 'webp' : 'jpg', path = 'qr/' + uuid() + '.' + ext;
      const { error } = await c.storage.from('hotel-public').upload(path, blob, { contentType: type, upsert: false });
      if (error) throw toErr(/row-level security|policy/i.test(error.message || '') ? 'permission_denied' : error);
      return c.storage.from('hotel-public').getPublicUrl(path).data.publicUrl;
    },
    // ---- staff ----
    async session() {
      if (LIVE) { const c = await client(); const { data } = await c.auth.getSession(); if (!data.session) return null; return await rpc('me'); }
      demoLoad(); let id = null; try { id = sessionStorage.getItem(USER_KEY); } catch (e) { }
      demoMe = Core.get().staff.find(s => s.id === id && s.active) || null; return demoMe;
    },
    demoStaff: () => { demoLoad(); return Core.get().staff.filter(s => s.active); },
    async login(email, password) {
      if (!LIVE) { demoMe = Core.get().staff.find(s => s.id === email); try { sessionStorage.setItem(USER_KEY, demoMe.id); } catch (e) { } return demoMe; }
      const c = await client(); const { error } = await c.auth.signInWithPassword({ email, password }); if (error) throw toErr(error);
      const me = await rpc('me'); if (!me) { await c.auth.signOut(); const e = new Error('not_staff'); e.code = 'not_staff'; throw e; } return me;
    },
    async logout() { if (LIVE) { const c = await client(); await c.auth.signOut(); } demoMe = null; try { sessionStorage.removeItem(USER_KEY); } catch (e) { } },
    async snapshot() {
      if (!LIVE) { const s = demoLoad(); s.me = null; const copy = JSON.parse(JSON.stringify(s)); copy.me = demoMe; copy.live = false; Core.set(s); copy.support = Core.adminSupport(); return copy; }
      const x = await rpc('admin_snapshot'); const s = normalize(x);
      if (s.me && s.me.role === 'owner') { try { s.staff = await rpc('admin_staff'); } catch (e) { } }
      try { const sup = await rpc('admin_support'); s.support = sup; } catch (e) { s.support = { threads: [], reviews: [] }; }
      try { const fin = await rpc('admin_finance'); s.assets = (fin.assets || []).map(x => ({ ...x, cost: +x.cost, salvage: +x.salvage, life: +x.life })); s.counts = (fin.counts || []).map(c => ({ ...c, counted: +c.counted, book: +c.book, diff: +c.diff })); s.closings = (fin.closings || []).map(c => ({ ...c, day: String(c.day).slice(0, 10), income: +c.income, expense: +c.expense })); s.jby = fin.jby || {}; } catch (e) { s.assets = []; s.counts = []; s.closings = []; s.jby = {}; }
      try { const st = await rpc('admin_stays'); const m = new Map(st.map(x => [x.id, x])); s.bookings.forEach(b => { const x = m.get(b.id); if (x) Object.assign(b, { ci_at: x.ci_at, co_at: x.co_at, ci_by: x.ci_by, co_by: x.co_by, old_code: x.old_code }); }); } catch (e) { }
      return s;
    },
    act(name, ...args) {
      if (!LIVE) {
        if (!Core[name]) return Promise.reject(toErr('unknown'));
        return demoRun(() => Core[name](...args), true);
      }
      if (STAFF_RPC[name]) { const [fn, a] = STAFF_RPC[name](...args); return rpc(fn, a); }
      return liveTable({ op: name, arg: args[0] });
    },
    resetDemo: () => { if (!LIVE) demoReset(); },
    asGuest() { guestMode = true; },
    // demo: another tab wrote to this browser's storage. live: poll the database while the page is visible
    onExternalChange(cb, everyMs) {
      if (typeof window === 'undefined') return;
      if (!LIVE) { window.addEventListener('storage', e => { if (e.key === KEY) cb(); }); return; }
      let t = null;
      const tick = () => { if (document.visibilityState === 'visible') cb(); };
      const start = () => { clearInterval(t); t = setInterval(tick, everyMs || 15000); };
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { cb(); start(); } else clearInterval(t); });
      window.addEventListener('focus', () => cb());
      start();
    }
  };
  return pub;
})();

    const head = `<div class="trow thead"><div class="rlabel" style="grid-column:1">${t('room')}</div>${days.map((d, i) => `<div class="dcell ${d === biz ? 'today' : ''} ${[0, 6].includes(dow(d)) ? 'we' : ''}" style="grid-column:${i + 2}">${WD[li()][dow(d)]}<b>${dsh(d)}</b></div>`).join('')}</div>`;
    const rows = S.rooms.filter(r => r.active).map(r => {
      const cells = days.map((d, i) => `<div class="tcell ${d === biz ? 'today' : ''} ${[0, 6].includes(dow(d)) ? 'we' : ''} ${d < biz ? 'past' : ''} ${r.hk === 'ooo' && d >= biz ? 'ooo' : ''}" style="grid-column:${i + 2}" ${d >= biz && r.hk !== 'ooo' ? `data-act="calCell" data-r="${r.no}" data-d="${d}"` : ''}></div>`).join('');
      const bars = S.bookings.filter(b => b.room === r.no && LIVE(b) && b.ci < end && b.co > st).map(b => {
        const a = b.ci < st ? 0 : diffD(st, b.ci), z = b.co > end ? 14 : diffD(st, b.co);
        return `<button class="bar ${b.status} ${b.ci < st ? 'cl' : ''} ${b.co > end ? 'cr' : ''}" style="grid-column:${a + 2}/${z + 2};background-color:var(--c-${b.ch})" data-act="openBk" data-id="${b.id}" title="${esc(b.guest.name)} · ${dfm(b.ci)}–${dfm(b.co)}">${b.status === 'pending' ? '⏳ ' : ''}${esc(b.guest.name)}</button>`;
      }).join('');
      return `<div class="trow"><div class="rlabel" style="grid-column:1"><span class="hkdot ${r.hk}" title="${esc(t('hk_' + r.hk))}"></span><b>${r.no}</b><span>${r.type}</span></div>${cells}${bars}</div>`;
    }).join('');
    return `<div class="spread"><div class="toolbar"><button class="btn" data-act="calMove" data-n="-7">${t('prevWeek')}</button><button class="btn" data-act="calMove" data-n="0">${t('today')}</button><button class="btn" data-act="calMove" data-n="7">${t('nextWeek')}</button><span class="muted tnum">${dfm(st)} – ${dfm(addD(end, -1))}</span></div><button class="btn pri" data-act="newBk">${t('newBooking')}</button></div>
    <div class="legend">${S.channels.map(c => `<span><i style="background:var(--c-${c.id})"></i>${nm(c.name)}</span>`).join('')}<span class="faint">· ${t('calHint')}</span></div>
    <div class="tape"><div class="tape-inner">${head}${rows}</div></div>
    <div class="legend">${['inspected', 'clean', 'dirty', 'ooo'].map(h => `<span><span class="hkdot ${h}" style="display:inline-block;margin-right:6px"></span>${t('hk_' + h)}</span>`).join('')}</div>`;
  }

  // ---------- bookings ----------
  function bkRows() {
    const q = V.bkQ.trim().toLowerCase();
    let list = S.bookings.filter(b => {
      if (V.bkSt === 'act' && !['pending', 'confirmed', 'inhouse'].includes(b.status)) return false;
      if (V.bkSt && !['act', 'all'].includes(V.bkSt) && b.status !== V.bkSt) return false;
      if (V.bkCh && b.ch !== V.bkCh) return false;
      if (q && !(b.guest.name.toLowerCase().includes(q) || b.id.toLowerCase().includes(q) || (b.code || '').toLowerCase().includes(q) || (b.old_code || '').toLowerCase().includes(q) || b.room.includes(q) || (/^[\d\s+()-]{4,}$/.test(q) && (b.guest.phone || '').replace(/\D/g, '').includes(q.replace(/\D/g, ''))))) return false;
      return true;
    }).sort((a, b) => V.bkSt === 'act' ? (a.ci < b.ci ? -1 : 1) : (a.ci > b.ci ? -1 : 1));
    const shown = list.slice(0, 150);
    return `<table class="t"><thead><tr><th>${t('code')}</th><th>${t('guest')}</th><th>${t('room')}</th><th>${t('arrive')}</th><th>${t('depart')}</th><th class="n">${t('nights')}</th><th>${t('channel')}</th><th>${t('status')}</th><th class="n">${t('total')}</th><th class="n">${t('balance')}</th></tr></thead><tbody>
    ${shown.map(b => { const tot = pre(b) ? b.rate * nightsOf(b) : Core.chargesOf(b); return `<tr class="click" data-act="openBk" data-id="${b.id}"><td class="mono small">${b.id}<div class="faint">${esc(b.code || '')}</div></td><td>${esc(b.guest.name)}<div class="small faint">${nm(COUNTRIES[b.guest.country] || COUNTRIES.OT)}${b.source === 'website' ? ' · ' + t('website') : ''}</div></td><td><span class="roomno">${b.room}</span></td><td class="tnum">${dfm(b.ci)}</td><td class="tnum">${dfm(b.co)}</td><td class="n">${nightsOf(b)}</td><td>${chTag(b.ch)}</td><td>${stPill(b.status)}</td><td class="n">${fm(tot)}</td><td class="n ${owed(b) > 0 && b.status === 'inhouse' ? 'warnc' : ''}">${['cancelled', 'noshow'].includes(b.status) ? '—' : fm(owed(b))}</td></tr>`; }).join('')}
    </tbody></table>${list.length > shown.length ? `<p class="small muted">${t('showing', { n: shown.length, t: list.length })}</p>` : ''}${!list.length ? `<div class="empty">${t('none')}</div>` : ''}`;
  }
  function claimsList() {
    const pc = pendingClaims();
    if (!pc.length) return `<div class="empty">${t('none')}</div>`;
    return `<p class="note" style="margin:0 0 10px">${t('claimsHint')}</p><div class="tablewrap"><table class="t"><thead><tr><th>${t('when')}</th><th>${t('guest')}</th><th>${t('code')}</th><th>${t('slip')}</th><th class="n">${t('amount')}</th><th></th></tr></thead><tbody>
      ${pc.map(c => { const b = S.bookings.find(x => x.id === c.bk) || { guest: {} }; return `<tr><td class="tnum small">${tfm(c.at)}</td><td>${esc(b.guest.name)}<div class="small faint">${esc(b.guest.phone || '')}</div></td><td class="mono small"><button class="btn sm ghost mono" data-act="openBk" data-id="${b.id}">${b.id} · ${esc(b.code || '')}</button></td><td>${c.slip ? `<button class="btn sm" data-act="viewSlip" data-id="${c.id}">${t('viewSlip')}</button>` : `<span class="mono small faint">${esc(c.ref || '—')}</span>`}</td><td class="n"><b>${fm(c.amt)}</b></td>
        <td><div class="row" style="justify-content:flex-end">${can('frontdesk', 'accountant', 'manager') ? `<button class="btn sm pri" data-act="viewSlip" data-id="${c.id}">${t('checkSlip')}</button>` : ''}</div></td></tr>`; }).join('')}</tbody></table></div>`;
  }
  function refundsList() {
    const rs = (S.refunds || []).filter(r => r.amount > 0);
    if (!rs.length) return `<div class="empty">${t('none')}</div>`;
    return `<p class="note" style="margin:0 0 10px">${t('refundsHint')}</p><div class="tablewrap"><table class="t"><thead><tr><th>${t('when')}</th><th>${t('guest')}</th><th>${t('code')}</th><th>${t('reason')}</th><th class="n">${t('fee')}</th><th class="n">${t('refundAmt')}</th><th>${t('status')}</th></tr></thead><tbody>
      ${rs.map(r => { const b = S.bookings.find(x => x.id === r.bk) || { guest: {} }; return `<tr class="click" data-act="openBk" data-id="${b.id}"><td class="tnum small">${tfm(r.at)}</td><td>${esc(b.guest.name)}<div class="small faint">${esc(b.guest.phone || '')}</div></td><td class="mono small">${b.id} · ${esc(b.code || '')}</td><td class="small">${t('rf_' + r.reason)}</td><td class="n">${fm(r.fee)}</td><td class="n"><b>${fm(r.amount)}</b></td><td>${r.status === 'paid' ? `<span class="pill p-inhouse">${t('refundPaidL')}</span>` : `<span class="pill p-pending">${t('refundOwedL')}</span>`}</td></tr>`; }).join('')}</tbody></table></div>`;
  }
  function vBk() {
    const pc = pendingClaims().length;
    return `<div class="tabs" role="tablist"><button class="${V.bkTab === 'list' ? 'on' : ''}" data-act="bkTab" data-t="list">${t('nav_bk')}</button><button class="${V.bkTab === 'claims' ? 'on' : ''}" data-act="bkTab" data-t="claims">${t('claims')}${pc ? ` <em class="badge">${pc}</em>` : ''}</button><button class="${V.bkTab === 'refunds' ? 'on' : ''}" data-act="bkTab" data-t="refunds">${t('refunds')}${owedRefunds().length ? ` <em class="badge">${owedRefunds().length}</em>` : ''}</button></div>
    ${V.bkTab === 'claims' ? `<div class="card">${claimsList()}</div>` : V.bkTab === 'refunds' ? `<div class="card">${refundsList()}</div>` : `<div class="spread"><div class="toolbar" style="flex:1"><input class="input grow" id="bkq" data-in="bkq" placeholder="${esc(t('search'))}" value="${esc(V.bkQ)}" style="max-width:360px">
      <select class="input" data-in="bkst" style="width:auto"><option value="act" ${V.bkSt === 'act' ? 'selected' : ''}>${t('st_active')}</option><option value="all" ${V.bkSt === 'all' ? 'selected' : ''}>${t('all')}</option>${['pending', 'confirmed', 'inhouse', 'out', 'cancelled', 'noshow'].map(s => `<option value="${s}" ${V.bkSt === s ? 'selected' : ''}>${t('st_' + s)}</option>`).join('')}</select>
      <select class="input" data-in="bkch" style="width:auto"><option value="">${t('channel')}: ${t('all')}</option>${S.channels.map(c => `<option value="${c.id}" ${V.bkCh === c.id ? 'selected' : ''}>${nm(c.name)}</option>`).join('')}</select></div>
      ${can('frontdesk', 'manager') ? `<button class="btn pri" data-act="newBk">${t('newBooking')}</button>` : ''}</div>
    <div class="card tablewrap" id="bktable">${bkRows()}</div>`}`;
  }

  // ---------- booking detail ----------
  function showBk(id, extra) {
    const b = S.bookings.find(x => x.id === id); if (!b) return;
    V.modal = { k: 'bk', id };
    const biz = S.bizDate, rm = S.rooms.find(r => r.no === b.room), fd = can('frontdesk', 'manager');
    const held = b.pays.filter(p => p.dep && !p.applied).reduce((s, p) => s + p.amt, 0);
    const total = pre(b) ? b.rate * nightsOf(b) : Core.chargesOf(b);
    const freeUntil = addD(b.ci, -S.settings.free_cancel_days), freeCancel = biz <= freeUntil;
    const voidedIds = new Set(b.folio.filter(f => f.voids).map(f => f.voids));
    let acts = '', pendNote = '';
    if (b.status === 'pending') {
      const paid = Core.paidOf(b), ok = paid >= (b.deposit_due || 0), waitC = S.claims.filter(c => c.bk === b.id && c.status === 'pending');
      pendNote = `<div class="note warn"><b>${t('pendTitle')}</b><br>${ok ? t('pendPaid', { a: kip(paid) }) : waitC.length ? t('pendSlip', { a: kip(waitC.reduce((x, c) => x + c.amt, 0)) }) : t('pendNoSlip', { a: kip(b.deposit_due || 0) })}</div>`;
      if (can('frontdesk', 'accountant', 'manager')) acts += `<button class="btn pri" data-act="acceptBk" data-id="${b.id}" ${ok ? '' : `disabled title="${esc(t('e_deposit_not_received'))}"`}>${t('acceptBk')}</button>`;
      if (fd) acts += `<button class="btn bad" data-act="doCancel" data-id="${b.id}" data-s="cancelled" ${held ? 'data-r="1"' : ''}>${t('declineBk')}${held ? ' · ' + t('refundDep') : ''}</button>`;
    }
    if (fd && b.status === 'confirmed') {
      acts += `<button class="btn pri" data-act="doCi" data-id="${b.id}">✓ ${t('tickIn')}</button>`;
      if (b.ci <= biz) acts += `<button class="btn bad" data-act="doCancel" data-id="${b.id}" data-s="noshow">${t('markNoShow')}</button>`;
      acts += held && freeCancel ? `<button class="btn bad" data-act="doCancel" data-id="${b.id}" data-s="cancelled" data-r="1">${t('cancelBk')} · ${t('refundDep')}</button>` : `<button class="btn bad" data-act="doCancel" data-id="${b.id}" data-s="cancelled">${t('cancelBk')}${held ? ' · ' + t('keepDep') : ''}</button>`;
    }
    if (fd && b.status === 'inhouse') {
      if (Core.roomFree(b.room, b.co, addD(b.co, 1), b.id)) acts += `<button class="btn" data-act="extend" data-id="${b.id}">${t('extend')}</button>`;
      acts += `<button class="btn pri" data-act="startCo" data-id="${b.id}">${t('checkOut')}</button>`;
    }
    const canPay = (pre(b) || b.status === 'inhouse') && can('frontdesk', 'accountant', 'manager');
    const claims = S.claims.filter(c => c.bk === b.id);
    openModal(`<div class="mh"><div><h2>${esc(b.guest.name)}</h2><p class="mono">${b.id} · ${t('bookingCode')} <b>${esc(b.code || '')}</b> · ${esc(b.guest.phone || '')} · ${nm(COUNTRIES[b.guest.country] || COUNTRIES.OT)}</p></div><div class="row">${stPill(b.status)}<button class="btn ghost" data-act="closeModal" aria-label="${esc(t('close'))}">✕</button></div></div>
    ${extra || ''}${pendNote}
    <div class="facts">
      <div class="fact"><label>${t('room')}</label><b>${b.room} · ${typeName(b.type)}</b></div>
      <div class="fact"><label>${t('arrive')} → ${t('depart')}</label><b>${dsh(b.ci)} → ${dsh(b.co)} (${nightsOf(b)})</b></div>
      <div class="fact"><label>${t('channel')}</label><b>${chTag(b.ch)}</b></div>
      <div class="fact"><label>${t('rate')}</label><b>${fm(b.rate)}${b.promo ? ' · ' + esc(b.promo) : ''}</b></div>
      <div class="fact"><label>${pre(b) ? t('total') : t('charges')}</label><b>${kip(total)}</b></div>
      <div class="fact"><label>${t('paid')}</label><b>${kip(Core.paidOf(b))}</b></div>
      <div class="fact"><label>${t('balance')}</label><b class="${owed(b) > 0 && b.status === 'inhouse' ? 'warnc' : ''}">${['cancelled', 'noshow'].includes(b.status) ? '—' : kip(owed(b))}</b></div>
      <div class="fact"><label>${t('source')}</label><b>${b.source === 'website' ? t('website') : t('staffSrc')} · ${dfm(b.created)}</b></div>
    </div>
    ${b.member ? (() => { const m = memberOf(b.member); return `<div class="note"><b>${t('memberAcct')}:</b> ${esc(m ? (m.name + ' · ' + (m.email || '')) : b.member)}${b.cancel_until ? ` · ${t('guestCancelUntil', { t: tfm(b.cancel_until) })}` : ''}
        <span class="row" style="display:inline-flex;margin-left:8px"><button class="btn sm" data-act="memHist" data-id="${esc(b.member)}">${t('memHistory')}</button>${can('manager') ? `<button class="btn sm ghost" data-act="unlinkMem" data-id="${b.id}">${t('unlink')}</button>` : ''}</span></div>`; })()
      : can('frontdesk', 'manager') && (S.members || []).length ? (() => {
        const ph = (b.guest.phone || '').replace(/\D/g, '').slice(-8), list = (S.members || []).slice().sort((x, y) => (((y.phone || '').replace(/\D/g, '').slice(-8) === ph) - ((x.phone || '').replace(/\D/g, '').slice(-8) === ph)));
        return `<div class="note warn"><b>${t('notLinked')}</b> ${t('notLinkedHint')}<div class="inline-form" style="grid-template-columns:1fr auto;margin-top:8px"><select class="input" id="lk_m">${list.map(m => `<option value="${esc(m.id)}">${(m.phone || '').replace(/\D/g, '').slice(-8) === ph && ph ? '★ ' : ''}${esc(m.name)} · ${esc(m.email || '')} · ${esc(m.phone || '')}</option>`).join('')}</select><button class="btn" data-act="linkMem" data-id="${b.id}">${t('linkMember')}</button></div></div>`; })() : ''}
    ${b.old_code ? `<div class="small muted">${t('oldCode')}: <span class="mono">${esc(b.old_code)}</span></div>` : ''}
    ${refundBlock(b)}
    ${b.request ? `<div class="note"><b>${t('request')}:</b> ${esc(b.request)}</div>` : ''}
    ${held ? `<div class="note">${t('deposit')}: ${kip(held)} — ${t('depositHeld')} (2150)${b.status === 'confirmed' ? ' · ' + t('freeCancelUntil', { d: dfm(freeUntil) }) : ''}</div>` : ''}
    ${pre(b) && b.deposit_due && !held ? `<div class="note warn">${t('depositDue')}: ${kip(b.deposit_due)}</div>` : ''}
    ${claims.length ? `<section><h4>${t('claims')}</h4><div class="list">${claims.map(c => `<div class="li"><div class="who"><b class="tnum">${kip(c.amt)}${c.ref ? ` · <span class="mono">${esc(c.ref)}</span>` : ''}</b><span>${tfm(c.at)}</span></div>${c.status === 'pending' && can('frontdesk', 'accountant', 'manager') ? `<button class="btn sm pri" data-act="viewSlip" data-id="${c.id}">${t('checkSlip')}</button>` : `${c.slip ? `<button class="btn sm" data-act="viewSlip" data-id="${c.id}">${t('viewSlip')}</button>` : ''}${c.bank_ref ? `<span class="mono small">${esc(c.bank_ref)}</span>` : ''}<span class="pill ${c.status === 'verified' ? 'p-inhouse' : c.status === 'pending' ? 'p-confirmed' : 'p-cancelled'}">${c.status === 'verified' ? t('verify') : c.status === 'pending' ? t('claims') : t('reject')}</span>`}</div>`).join('')}</div></section>` : ''}
    <section><h4>${t('folio')}</h4><div class="tablewrap"><table class="t"><thead><tr><th>${t('date')}</th><th>${t('desc')}</th><th class="n">VAT</th><th class="n">${t('amount')}</th><th></th></tr></thead><tbody>
    ${b.folio.map(f => `<tr class="${f.voids || voidedIds.has(f.id) ? 'struck' : ''}"><td class="tnum">${dsh(f.date)}</td><td>${descText(f.desc)} <span class="faint small">${nm(KIND[f.kind])}</span>${voidedIds.has(f.id) ? ` <span class="pill p-cancelled">${t('voided')}</span>` : ''}</td><td class="n faint">${fm(f.vat)}</td><td class="n">${fm(f.gross)}</td>
      <td class="n">${can('manager') && b.status === 'inhouse' && !f.voids && !voidedIds.has(f.id) ? `<button class="btn sm ghost" data-act="voidAsk" data-b="${b.id}" data-f="${f.id}">${t('voidIt')}</button>` : ''}</td></tr>`).join('') || `<tr><td colspan="5" class="empty">${pre(b) ? fm(b.rate) + ' × ' + nightsOf(b) : t('none')}</td></tr>`}
    </tbody></table></div>
    ${V.voidAsk && V.voidAsk.b === b.id ? `<div class="inline-form p3"><label class="field"><span>${t('voidReason')}</span><input class="input" id="vd_r"></label><span></span><button class="btn bad" data-act="voidDo">${t('voidIt')}</button></div>` : ''}
    ${b.status === 'inhouse' && fd ? `<div class="inline-form"><label class="field"><span>${t('kind')}</span><select class="input" id="fc_k">${Object.keys(KIND).filter(k => k !== 'room').map(k => `<option value="${k}">${nm(KIND[k])}</option>`).join('')}</select></label><label class="field"><span>${t('desc')}</span><input class="input" id="fc_d"></label><label class="field"><span>${t('amount')}</span><input class="input" id="fc_a" type="number" min="0" step="1000" inputmode="numeric"></label><button class="btn" data-act="addCharge" data-id="${b.id}">${t('addCharge')}</button></div>` : ''}
    </section>
    <section><h4>${t('payments')}</h4><div class="tablewrap"><table class="t"><tbody>
    ${b.pays.map(p => `<tr><td class="tnum">${dsh(p.date)}</td><td>${nm(PM[p.m])} ${p.dep ? `<span class="faint small">· ${t('deposit')}</span>` : ''}${p.refund ? `<span class="bad small"> · ${t('refund')}</span>` : ''}${p.ref ? ` <span class="mono faint small">${esc(p.ref)}</span>` : ''}</td><td class="n">${p.refund ? '−' : ''}${fm(p.amt)}</td></tr>`).join('') || `<tr><td class="empty">${t('none')}</td></tr>`}
    </tbody></table></div>
    ${canPay ? `<div class="inline-form"><label class="field"><span>${t('payMethod')}</span><select class="input" id="pf_m">${Object.keys(PM).map(k => `<option value="${k}">${nm(PM[k])}</option>`).join('')}</select></label><label class="field"><span>${t('ref')}</span><input class="input" id="pf_r"></label><label class="field"><span>${t('amount')}</span><input class="input" id="pf_a" type="number" min="0" step="1000" inputmode="numeric" value="${b.status === 'inhouse' ? Math.max(0, Core.balanceOf(b)) : Math.max(0, (b.deposit_due || 0) - held)}"></label><button class="btn" data-act="addPay" data-id="${b.id}">${pre(b) ? t('deposit') : t('addPay')}</button></div>` : ''}
    </section>
    ${acts ? `<div class="actions">${acts}</div>` : ''}`);
  }
  function refundBlock(b) {
    const rs = (S.refunds || []).filter(r => r.bk === b.id); if (!rs.length) return '';
    return `<section><h4>${t('refunds')}</h4><div class="list">${rs.map(r => `<div class="li"><div class="who"><b class="tnum">${kip(r.amount)} <span class="faint small">(${pct(r.pct / 100)} · ${t('fee')} ${fm(r.fee)})</span></b><span>${t('rf_' + r.reason) || esc(r.reason)} · ${tfm(r.at)}</span></div>
      ${r.status === 'paid' ? `<span class="pill p-inhouse">${t('refundPaidL')}${r.paid_ref ? ' · ' + esc(r.paid_ref) : ''}</span>` : r.amount > 0 && can('manager', 'accountant') ? (V.refundAsk === r.id
        ? `<div class="inline-form" style="margin:0"><label class="field"><span>${t('payMethod')}</span><select class="input" id="rf_m"><option value="transfer">${nm(PM.transfer)}</option><option value="qr">${nm(PM.qr)}</option><option value="cash">${nm(PM.cash)}</option></select></label><label class="field"><span>${t('bankRef')}</span><input class="input mono" id="rf_r"></label><button class="btn pri" data-act="refundDo" data-id="${r.id}">${t('refundMark')}</button></div>`
        : `<button class="btn sm pri" data-act="refundForm" data-id="${r.id}">${t('refundMark')}</button>`) : `<span class="pill p-pending">${t('refundOwedL')}</span>`}</div>`).join('')}</div></section>`;
  }
  function startCo(id) {
    const b = S.bookings.find(x => x.id === id), ch = CHM()[b.ch];
    const bal = Core.balanceOf(b), room = Core.roomGrossOf(b), comm = Math.round(room * ch.comm);
    let info = '';

  // ---------- check-in / check-out status ----------
  // For the chosen day: who is expected and not yet in, who arrived, who is staying, who must leave and who has left.
  function stayGroups(D) {
    const biz = S.bizDate, B = S.bookings, isBiz = D === biz;
    // every booking that is booked (paid / awaiting payment) and not checked in yet, whatever the arrival date
    const notin = B.filter(b => b.status === 'confirmed' || b.status === 'pending').sort((a, b) => a.ci.localeCompare(b.ci) || a.room.localeCompare(b.room));
    const arr = B.filter(b => b.ci === D && b.status !== 'cancelled');
    return {
      notin,
      arrived: B.filter(b => (b.status === 'inhouse' || b.status === 'out') && (b.ci_at ? tday(b.ci_at) === D : b.ci === D)),
      staying: isBiz ? B.filter(b => b.status === 'inhouse') : B.filter(b => (b.status === 'inhouse' || b.status === 'out') && b.ci <= D && D < b.co),
      dueout: B.filter(b => b.status === 'inhouse' && b.co <= D),
      left: B.filter(b => b.status === 'out' && (b.co_at ? tday(b.co_at) === D : b.co === D)),
      noshow: arr.filter(b => b.status === 'noshow')
    };
  }
  const tday = iso => { try { return new Date(new Date(iso).getTime() + 7 * 3600e3).toISOString().slice(0, 10); } catch (e) { return ''; } };
  const realToday = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
  const STF = ['notin', 'arrived', 'staying', 'dueout', 'left', 'noshow'];
  // what the desk can do with a booking right now, and why not when it cannot
  // one tap after the real-world step is done: tick "checked in" when the key is handed over, "checked out" when the guest has left
  function stayAction(b) {
    const biz = S.bizDate, fd = can('frontdesk', 'manager');
    if (b.status === 'confirmed') {
      if (!fd) return '';
      if (V.stAsk === b.id) { const n = diffD(biz, b.ci);
        return `<div class="tickask"><small>${t('earlyQ', { n, d: dfm(biz) })}</small><div class="row" style="justify-content:flex-end"><button class="btn sm" data-act="stAskNo">${t('cancel')}</button><button class="btn sm pri" data-act="stTickIn" data-id="${b.id}" data-early="1">✓ ${t('earlyYes')}</button></div></div>`; }
      return `<button class="tk" data-act="stTickIn" data-id="${b.id}"><i></i>${t('tickIn')}</button>${b.ci > biz ? `<div class="tiny faint">${t('earlyHint', { d: dsh(b.ci) })}</div>` : ''}`;
    }
    if (b.status === 'pending') return `<span class="tk off"><i></i>${t('tickIn')}</span><div class="tiny warnc">${t('needPay')}</div>`;
    if (b.status === 'inhouse') return `<span class="tk done"><i>✓</i>${t('st_inhouse')}</span>${fd ? `<button class="tk" data-act="stTickOut" data-id="${b.id}"><i></i>${t('tickOut')}</button>` : ''}`;
    if (b.status === 'out') return `<span class="tk done"><i>✓</i>${t('st_inhouse')}</span><span class="tk done"><i>✓</i>${t('st_out')}</span>`;
    return '';
  }
  function vStay() {
    const biz = S.bizDate, D = V.stDate || biz, G = stayGroups(D), q = V.stQ.trim().toLowerCase(), lag = realToday() > biz;
    const f = STF.includes(V.stF) ? V.stF : 'notin';
    const tone = { notin: 'warn', arrived: 'good', staying: 'info', dueout: 'warn', left: 'good', noshow: 'bad' };
    const tiles = `<div class="staytiles">${STF.map(k => `<button class="stile ${tone[k]} ${f === k && !q ? 'on' : ''}" data-act="stF" data-f="${k}"><span>${t('sg_' + k)}</span><b>${G[k].length}</b><small>${t(k === 'notin' ? 'sgd_notin_all' : 'sgd_' + k)}</small></button>`).join('')}</div>`;
    const norm = x => String(x || '').toLowerCase();
    const match = b => norm(b.guest.name).includes(q) || norm(b.code).includes(q) || norm(b.old_code).includes(q) || b.room.includes(q) || norm(b.id).includes(q) || (/\d{4,}/.test(q) && (b.guest.phone || '').replace(/\D/g, '').includes(q.replace(/\D/g, '')));
    // a search looks through every booking, not only the selected group or day
    const searching = q.length > 0;

        <td class="tnum">${dsh(b.ci)} → ${dsh(b.co)} <span class="faint">(${nightsOf(b)})</span></td><td>${stPill(b.status)} ${flag(b)}</td>
        <td>${b.ci_at || b.co_at ? `${when(b.ci_at, b.ci_by, '↘')}${b.co_at ? when(b.co_at, b.co_by, '↗') : ''}` : '<span class="faint">—</span>'}</td><td class="n">${pay(b)}</td><td class="n">${stayAction(b)}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">${searching ? t('sl_noMatch') : t('sl_none')}</div>`;
    const wins = f === 'notin' && !searching ? `<div class="toolbar" style="margin:0 0 10px">${['all', 'today', 'late', 'soon', 'unpaid'].map(w => `<button class="btn sm ${(V.stWin || 'all') === w ? 'pri' : ''}" data-act="stWin" data-w="${w}">${t('sw_' + w)}</button>`).join('')}</div>` : '';
    const dayNav = !searching && f !== 'notin' ? `<div class="toolbar"><button class="btn sm" data-act="stDay" data-n="-1" aria-label="${esc(t('prevDay'))}">‹</button><input class="input" type="date" id="st_date" value="${D}" style="width:auto"><button class="btn sm" data-act="stDay" data-n="1" aria-label="${esc(t('nextDay'))}">›</button>${D !== biz ? `<button class="btn sm" data-act="stDay" data-n="0">${t('bizDay')}</button>` : ''}</div>` : '';
    return `${lag ? `<div class="note warn spread"><span>${t('bizLag', { b: dfm(biz), r: dfm(realToday()) })}</span>${can('manager', 'frontdesk') ? `<button class="btn sm pri" data-act="nightAudit">${t('naRun')}</button>` : ''}</div>` : ''}
      <div class="card stayfind"><label class="codeq"><span class="pre">SN</span><input id="st_code" inputmode="numeric" maxlength="12" placeholder="0000" autocomplete="off" value="${esc(V.stCode || '')}" aria-label="${esc(t('sl_codeSearch'))}"></label>

  // ---------- channels & marketing ----------
  function monthsList() { const out = []; const first = (S.journal[0] && S.journal[0].date || S.bizDate).slice(0, 7); let m = first; const last = addD(S.bizDate, 45).slice(0, 7); while (m <= last) { out.push(m); m = addD(m + '-01', 32).slice(0, 7); } return out; }
  function chStats(from, to) {
    const st = {}; S.channels.forEach(c => st[c.id] = { bk: 0, rn: 0, rev: 0, comm: 0 });
    for (const b of S.bookings) {
      if (!LIVE(b) || !st[b.ch]) continue;
      const a = b.ci > from ? b.ci : from, z = b.co < addD(to, 1) ? b.co : addD(to, 1), n = diffD(a, z); if (n <= 0) continue;
      const s = st[b.ch], c = CHM()[b.ch]; s.bk++; s.rn += n; s.rev += n * b.rate; s.comm += Math.round(n * b.rate * c.comm);
    }
    return st;
  }
  function vMkt() {

      const tb = document.getElementById(d.t); if (!tb) return;
      const tsv = [...tb.querySelectorAll('tr')].map(tr => [...tr.children].map(c => c.innerText.replace(/\s+/g, ' ').trim().replace(/^\((.*)\)$/, '-$1')).join('\t')).join('\n');
      const fail = () => { const r = document.createRange(); r.selectNodeContents(tb); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t('copyFail')); };
      try { navigator.clipboard.writeText(tsv).then(() => toast(t('copied')), fail); } catch (e) { fail(); }
    },
    saveSet: async () => {
      const p = { hotel: $('#s_name').value.trim() || S.settings.hotel, address: $('#s_addr').value.trim(), phone: $('#s_phone').value.trim(), email: $('#s_email').value.trim(), vat: Math.max(0, Math.min(30, +$('#s_vat').value || 0)), incl: $('#s_incl').checked, deposit_pct: +$('#s_dep').value || 0, direct_discount: +$('#s_dd').value || 0, free_cancel_days: +$('#s_fc').value || 0, cancel_cutoff_hours: Math.max(0, Math.min(72, +$('#s_cxh').value || 0)), cancel_refund_pct: Math.max(0, Math.min(100, +$('#s_cxp').value || 0)), pending_hold_hours: Math.max(1, Math.min(168, +$('#s_hold').value || 24)), tax: Math.max(0, Math.min(50, +$('#s_tax').value || 0)), close: { depr: +$('#s_c_depr').value || 0, sal: +$('#s_c_sal').value || 0, int: +$('#s_c_int').value || 0 } };
      try { await act('saveSettings', p); render(); toast(t('saved')); } catch (e) { }
    },
    staffAdd: async () => { const e = $('#st_e').value.trim(), n = $('#st_n').value.trim(); if (!e || !n) return toast(t('errName')); try { await act('saveStaff', { email: e, name: n, role: $('#st_r').value }); render(); toast(t('saved')); } catch (er) { } },
    staffToggle: async d => { const u = S.staff.find(x => x.id === d.id); try { await act('saveStaff', { ...u, active: !u.active }); render(); } catch (e) { } },
    qrRemove: async () => { try { await act('saveSettings', { payment_qr_url: null }); render(); toast(t('saved')); } catch (e) { } },
    resetAsk: () => { V.resetAsk = true; render(); }, resetNo: () => { V.resetAsk = false; render(); },
    resetYes: async () => { API.resetDemo(); V.resetAsk = false; V.calStart = null; V.period = null; V.mktMonth = null; await refresh(); render(); toast(t('saved')); }
  };
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset, el); } });
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'loginForm') return; e.preventDefault();
    try { await API.login($('#lg_e').value.trim(), $('#lg_p').value); await refresh(); V.view = firstView(); $('#root').innerHTML = ''; render(); }
    catch (er) { $('#lg_msg').innerHTML = `<div class="note bad">${esc(errText(er))}</div>`; }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'st_code') { e.preventDefault(); A.stFind(); } });
  document.addEventListener('input', e => {
    if (e.target.id === 'sv_ref') syncVerifyBtn();
    const el = e.target, k = el.dataset && el.dataset.in;
    if (el.classList && el.classList.contains('ob')) { obTotals(); return; }
    if (!k) return;
    if (k === 'ccv') { const acc = el.dataset.acc, book = Core.accBal(acc, S.bizDate), dv = Math.round(+el.value || 0) - book; $('#cc_d_' + acc).innerHTML = el.value === '' ? '' : dv === 0 ? `<span class="good">✓ ${t('ccMatch')}</span>` : `<span class="bad">${t('diff')} ${par(dv)}</span> · ${t(acc === '1110' ? 'ccPostsDiff' : 'ccBankDiff')}`; return; }
    if (k === 'bkq') { V.bkQ = el.value; $('#bktable').innerHTML = bkRows(); }
    else if (k === 'stq') { V.stQ = el.value; const pos = el.selectionStart; render(); const i = $('#stq'); i.focus(); i.setSelectionRange(pos, pos); }
    else if (k === 'gq') { V.gQ = el.value; const pos = el.selectionStart; render(); const i = $('#gq'); i.focus(); i.setSelectionRange(pos, pos); }
    else if (k === 'auq') { V.auQ = el.value; const pos = el.selectionStart; render(); const i = $('#auq'); i.focus(); i.setSelectionRange(pos, pos); }
    else if (k === 'jer') { V.jeRows[+el.dataset.i][el.dataset.f] = el.value; jeTotals(); }
  });
  document.addEventListener('change', async e => {
    if (e.target.id === 'sv_ok' || e.target.id === 'sv_ref') syncVerifyBtn();
    if (e.target.id === 'st_date' && e.target.value) { V.stDate = e.target.value; render(); return; }
    const el = e.target, k = el.dataset && el.dataset.in;
    if (el.id === 's_qr') {
      const f = el.files && el.files[0]; if (!f) return;
      if (!/^image\/(png|jpeg|webp)$/.test(f.type)) { toast(t('payQrType')); return; }
      if (f.size > 3 * 1048576) { toast(t('payQrBig')); return; }
      try { toast(t('loading')); const url = await API.uploadQr(f, f.type); await act('saveSettings', { payment_qr_url: url }); render(); toast(t('saved')); } catch (er) { toast(errText(er)); }
      return;
    }
    if (!k) return;
    if (k === 'bkst') { V.bkSt = el.value; $('#bktable').innerHTML = bkRows(); }
    else if (k === 'bkch') { V.bkCh = el.value; $('#bktable').innerHTML = bkRows(); }
    else if (k === 'nb') nbRefresh(false);
    else if (k === 'nbt') nbRefresh(true);
    else if (k === 'mktm') { V.mktMonth = el.value; render(); }
    else if (k === 'aper') { V.period = el.value; V.jeLimit = 50; V.dbDay = ''; render(); }
    else if (k === 'dbDay') { V.dbDay = el.value; render(); }
    else if (k && k.startsWith('ms') && el.value) { const m = msState(), f = { msDay: 'day', msMonth: 'month', msYear: 'year', msFrom: 'from', msTo: 'to' }[k]; if (f) { m[f] = el.value; V.msLimit = 100; render(); } }
    else if (k === 'wi') { V.wi = V.wi || {}; ['name', 'phone'].forEach(x => V.wi[x] = ($('#wi_' + x) || {}).value || ''); V.wi.m = ($('#wi_m') || {}).value; const f = el.dataset.f; if (f === 'paid') { V.wi.paid = el.value; V.wi.paidTouched = true; } else V.wi[f] = el.value; if (f !== 'paid') walkInForm(); }
    else if (k === 'aua') { V.auA = el.value; render(); }
    else if (k === 'jer') { V.jeRows[+el.dataset.i][el.dataset.f] = el.value; jeTotals(); }
    else if (el.id === 's_qr') { }
    else if (k === 'staffRole') { const u = S.staff.find(x => x.id === el.dataset.id); try { await act('saveStaff', { ...u, role: el.value }); render(); } catch (er) { render(); } }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
  // a booking made on the guest website in another tab shows up here (demo mode shares this browser's storage)
  // keep the back office current: new website bookings and slips appear without pressing refresh
  const sig = () => S ? [S.bookings.length, S.claims.filter(c => c.status === 'pending').length, S.audit[0] ? S.audit[0].id : 0, S.journal.length, S.bizDate, SUP().threads.reduce((n, x) => n + x.messages.length, 0), SUP().reviews.length].join('|') : '';
  let polling = false;
  API.onExternalChange(async () => {
    if (!S || !S.me || V.busy || polling) return;
    polling = true;
    try {
      const before = sig(), knownBk = new Set(S.bookings.map(b => b.id)), knownCl = new Set(S.claims.map(c => c.id));
      const fresh = await API.snapshot(); if (!fresh || !fresh.me) return;
      const newBk = fresh.bookings.filter(b => !knownBk.has(b.id)), newCl = fresh.claims.filter(c => !knownCl.has(c.id) && c.status === 'pending');
      S = fresh; Core.set(S);
      if (sig() === before) return;
      const typing = document.activeElement && document.activeElement.closest('#view') && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (!typing) render();                                   // an open dialog keeps its own content; the page behind it updates
      if (newBk.length) toast(t('newWebBooking') + ': ' + newBk.map(b => b.guest.name).join(', '));
      else if (newCl.length) toast(t('claims') + ': ' + newCl.length);
    } catch (e) { } finally { polling = false; }
  }, 15000);

  (async function boot() {
    try { const me = await API.session(); if (me) { await refresh(); V.view = firstView(); render(); } else renderLogin(); }
    catch (e) { renderLogin(); }
  })();
})();

</script>
</body>
</html>
