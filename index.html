<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Saynam Riverside Hotel</title>
<meta name="description" content="Riverside hotel in Vientiane. Book direct for the best price.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Lao:wght@500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap">
<style>
/* Layout: one long page — dawn-on-the-Mekong hero with the date search floating over its lower edge, then rooms, amenities, location, FAQ. Booking runs in a focused sheet. */
:root{
  --bg:#edf2f1; --paper:#ffffff; --mist:#f5f8f7; --line:#d5dfdc; --ink:#13231f; --muted:#56676322; --sub:#56676b; --faint:#8a9895;
  --river:#13524a; --river-2:#0c3a34; --river-soft:#d7ebe6; --champa:#df951f; --champa-2:#c98114; --champa-ink:#241503; --champa-soft:#fbecd2;
  --good:#257a46; --good-soft:#dcf0e3; --warn:#9a6208; --warn-soft:#fbefd9; --bad:#ad3a2b; --bad-soft:#f7e0dc;
  --sky1:#f8e3bd; --sky2:#f2b98a; --sky3:#a9c9c4; --sun:#fff2d2; --hill1:#7d9fa0; --hill2:#4f7a78; --water1:#5f8f8b; --water2:#2f5f5a; --bank:#173d38; --glint:#fff4dc;
  --f-display:"Fraunces","Noto Serif Lao","Noto Serif Thai",Georgia,serif;
  --f-body:"Figtree","Noto Sans Lao","Noto Sans Thai",system-ui,sans-serif;
  --r:14px; --shadow:0 2px 6px rgba(19,35,31,.06),0 14px 40px rgba(19,35,31,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1615; --paper:#13211f; --mist:#172725; --line:#26403b; --ink:#e5eeeb; --sub:#9fb2ad; --faint:#6f8580;
  --river:#5bc1b0; --river-2:#7fd3c4; --river-soft:#173b35; --champa:#f0ab42; --champa-2:#f6bd63; --champa-ink:#241503; --champa-soft:#3a2b12;
  --good:#5fc285; --good-soft:#163525; --warn:#e8ad4f; --warn-soft:#3a2b12; --bad:#ec7b66; --bad-soft:#3d1c17;
  --sky1:#1c2346; --sky2:#5b3b5c; --sky3:#c9775a; --sun:#ffd6a0; --hill1:#2d3655; --hill2:#1d2540; --water1:#2a3456; --water2:#141c33; --bank:#0a1110; --glint:#ffcf94;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 14px 40px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1615; --paper:#13211f; --mist:#172725; --line:#26403b; --ink:#e5eeeb; --sub:#9fb2ad; --faint:#6f8580;
  --river:#5bc1b0; --river-2:#7fd3c4; --river-soft:#173b35; --champa:#f0ab42; --champa-2:#f6bd63; --champa-ink:#241503; --champa-soft:#3a2b12;
  --good:#5fc285; --good-soft:#163525; --warn:#e8ad4f; --warn-soft:#3a2b12; --bad:#ec7b66; --bad-soft:#3d1c17;
  --sky1:#1c2346; --sky2:#5b3b5c; --sky3:#c9775a; --sun:#ffd6a0; --hill1:#2d3655; --hill2:#1d2540; --water1:#2a3456; --water2:#141c33; --bank:#0a1110; --glint:#ffcf94;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 14px 40px rgba(0,0,0,.35); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--champa);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:18px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.logo b{font-family:var(--f-display);font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo svg{flex:none}
.links{display:flex;gap:4px}
.links a{color:var(--sub);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14.5px;white-space:nowrap}
.links a:hover{color:var(--ink);background:var(--mist)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--sub)}
.lang button.on{background:var(--river);color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;line-height:1.3}
.btn:hover{border-color:var(--faint)}
.btn.cta{background:var(--champa);border-color:var(--champa);color:var(--champa-ink);font-weight:600}
.btn.cta:hover{background:var(--champa-2);border-color:var(--champa-2)}
.btn.dark{background:var(--river);border-color:var(--river);color:var(--paper)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sub)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.demo{background:var(--champa-soft);color:var(--ink);font-size:13px}
.demo .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:7px;flex-wrap:wrap}
.demo a{color:var(--river);font-weight:600}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--sky1)}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,var(--sky1) 0%,color-mix(in srgb,var(--sky1) 70%,transparent) 38%,transparent 62%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-block:64px 150px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--river-2);font-weight:600}
.hero h1{font-size:clamp(30px,4.3vw,52px);max-width:19ch;color:var(--ink)}
.hero p{max-width:46ch;margin:0;font-size:17px;color:var(--ink);opacity:.86}
:root[data-theme="dark"] .hero h1,:root[data-theme="dark"] .hero p{color:#fff6e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero h1,:root:not([data-theme="light"]) .hero p,:root:not([data-theme="light"]) .hero .eyebrow{color:#fff6e8}}
:root[data-theme="dark"] .hero .eyebrow{color:#fff6e8}

/* search bar */
.search{position:relative;z-index:2;margin-top:-64px}
.sbar{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px;align-items:stretch}
.sbar label{display:flex;flex-direction:column;gap:2px;padding:8px 14px;border-radius:12px;min-width:0}
.sbar label:hover{background:var(--mist)}
.sbar label span{font-size:12px;color:var(--sub);font-weight:500}
.sbar input,.sbar select{border:0;background:transparent;padding:0;font-size:16px;font-weight:600;min-width:0;width:100%}
.sbar input:focus,.sbar select:focus{outline:none}
.sbar .btn{border-radius:12px;padding-inline:26px;font-size:16px}
.sbar .nights{grid-column:1/-1;font-size:13px;color:var(--sub);padding:0 14px 4px}

.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-block:34px 10px}
.why>div{display:flex;gap:12px;align-items:flex-start}
.why i{flex:none;width:38px;height:38px;border-radius:50%;background:var(--river-soft);color:var(--river);display:grid;place-items:center}
.why b{display:block;font-weight:600}
.why span{font-size:14px;color:var(--sub)}

section.blk{padding-block:56px}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.blk-h h2{font-size:clamp(26px,3.4vw,38px)}
.blk-h p{margin:0;color:var(--sub);max-width:52ch}

/* rooms */
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.room{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.room .art{aspect-ratio:16/9;max-width:100%;background:var(--mist)}
.room .art svg{width:100%;height:100%;display:block}
.room .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.room h3{font-size:23px}
.room .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--sub)}
.room .meta span{display:inline-flex;gap:6px;align-items:center}
.room p{margin:0;color:var(--sub)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;background:var(--mist);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--sub)}
.chip svg{color:var(--river)}
.room .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.price small{display:block;font-size:12.5px;color:var(--sub)}
.price b{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.price s{color:var(--faint);font-size:13px;margin-left:6px}

/* amenities */
.amen{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.amen div{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px}
.amen i{flex:none;width:34px;height:34px;border-radius:10px;background:var(--champa-soft);color:var(--champa-2);display:grid;place-items:center}

.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:20px}
.contact{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;font-size:14.5px}
.contact .k{color:var(--sub);font-size:13px}
.contact span{overflow-wrap:anywhere}
ul.pol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
ul.pol li{display:flex;gap:10px;font-size:14.5px}
ul.pol li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--champa);margin-top:9px}
details{border-bottom:1px solid var(--line);padding-block:12px}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details summary::after{content:"+";color:var(--river);font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details p{margin:8px 0 0;color:var(--sub);max-width:70ch}
footer{border-top:1px solid var(--line);padding-block:26px 40px;color:var(--sub);font-size:13.5px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--sub)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end}
#sheet .scrim{position:absolute;inset:0;background:rgba(8,20,18,.5)}
#sheet .pane{position:relative;width:min(560px,100%);height:100%;background:var(--paper);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.pane-h{display:flex;align-items:center;gap:10px;padding:16px max(20px,env(safe-area-inset-right,0px)) 12px 20px;padding-top:max(16px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.pane-h h2{font-size:21px;margin-right:auto}
.steps{display:flex;gap:6px;padding:12px 20px 0}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--champa)}
.steplabel{padding:6px 20px 0;font-size:12.5px;color:var(--sub)}
.pane-b{flex:1;overflow-y:auto;padding:16px max(20px,env(safe-area-inset-right,0px)) 24px 20px;display:flex;flex-direction:column;gap:14px}
.pane-f{border-top:1px solid var(--line);padding:14px max(20px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) 20px;display:flex;gap:10px;align-items:center}
.pane-f .sum{margin-right:auto;font-size:13px;color:var(--sub)}
.pane-f .sum b{display:block;color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:1fr 1fr 90px;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;color:var(--sub);font-weight:500}
.field small{font-size:12px;color:var(--faint)}
.in{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;min-width:0}
.in:focus{outline:none;border-color:var(--river);box-shadow:0 0 0 3px var(--river-soft)}
.opt{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;border:1.5px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;background:var(--paper);text-align:left;width:100%}
.opt:hover{border-color:var(--river)}
.opt.sold{opacity:.55;cursor:not-allowed}
.opt .thumb{border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.opt .thumb svg{width:100%;height:100%;display:block}
.opt b{font-family:var(--f-display);font-size:17px;font-weight:600;display:block}
.opt .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.flag{font-size:12px;font-weight:600;color:var(--warn)}
.flag.bad{color:var(--bad)}
.flag.ok{color:var(--good)}
.summary{background:var(--mist);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;font-size:14.5px}
.summary .k{color:var(--sub)}
.summary .v{text-align:right;font-variant-numeric:tabular-nums}
.summary .tot{font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.msg{border-radius:10px;padding:10px 12px;font-size:14px}
.msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.ok{background:var(--good-soft);color:var(--good)} .msg.info{background:var(--river-soft);color:var(--ink)} .msg.warn{background:var(--warn-soft);color:var(--warn)}
.codebox{text-align:center;background:var(--river-soft);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:6px}
.codebox .code{font-family:var(--f-display);font-size:40px;font-weight:700;letter-spacing:.12em;color:var(--river)}
.qr{display:flex;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;flex-wrap:wrap}
.qr canvas,.qr img{width:150px;height:150px;image-rendering:pixelated;border-radius:6px;background:#fff;flex:none}
.qr .txt{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.qr .amt{font-family:var(--f-display);font-size:26px;font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600}
.s-pending{background:var(--warn-soft);color:var(--warn)} .s-confirmed{background:var(--good-soft);color:var(--good)} .s-inhouse,.s-out{background:var(--good-soft);color:var(--good)} .s-cancelled,.s-noshow{background:var(--bad-soft);color:var(--bad)}
#toast{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px}

@media (max-width:900px){
  .links{display:none}
  .rooms,.two{grid-template-columns:minmax(0,1fr)}
  .why{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .hdr .wrap{gap:10px}
  .hdr .btn.cta{padding:8px 12px}
  .hero .wrap{padding-block:44px 104px}
  .sbar{grid-template-columns:1fr 1fr}
  .sbar .btn{grid-column:1/-1;padding-block:12px}
  .mini{grid-template-columns:1fr 1fr}
  .mini .field:last-child{grid-column:1/-1}
  .opt{grid-template-columns:76px minmax(0,1fr)}
  .contact{grid-template-columns:minmax(0,1fr) auto}
  .contact .k{grid-column:1/-1;margin-bottom:-8px}
}

.linkbtn{border:0;background:none;padding:0;color:var(--river);font-weight:600;text-decoration:underline;cursor:pointer;font-size:inherit}

.qrimg{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.qrimg img,.qrimg canvas{width:180px;height:180px;object-fit:contain;image-rendering:auto;border-radius:8px;background:#fff;border:1px solid var(--line)}
.qrimg canvas{image-rendering:pixelated}
.qrimg .linkbtn{font-size:12.5px}
.qrmissing{flex:1 1 200px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px;font-size:14px}
.slipdrop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:20px 14px;cursor:pointer;color:var(--river);background:var(--mist)}
.slipdrop:hover,.slipdrop:focus-within{border-color:var(--river)}
.slipdrop b{color:var(--ink);font-weight:600}
.slipdrop small{color:var(--sub);font-size:12.5px}
.slipok{display:flex;gap:12px;align-items:center;border:1.5px solid var(--good);background:var(--good-soft);border-radius:14px;padding:10px}
.slipok img{width:72px;height:96px;object-fit:cover;border-radius:8px;background:#fff;flex:none}
.slipok div{display:flex;flex-direction:column;gap:2px;min-width:0}
.slipok b{color:var(--good)}
.slipok small{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slipok .linkbtn{align-self:flex-start;font-size:13px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.field:focus-within .slipdrop{border-color:var(--river);box-shadow:0 0 0 3px var(--river-soft)}

.trk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;list-style:none;margin:0;padding:0;counter-reset:t}
.trk li{position:relative;padding-top:30px;text-align:center;font-size:12.5px;color:var(--faint);line-height:1.3}
.trk li::before{counter-increment:t;content:counter(t);position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--line,#e3e8e6);color:var(--sub)}
.trk li.done{color:var(--good)} .trk li.done::before{content:'✓';background:var(--good);color:#fff}
.trk li.now{color:var(--ink);font-weight:600} .trk li.now::before{background:var(--warn);color:#fff}
.msg.big{font-size:16px;padding:14px 16px}

/* ---- member accounts ---- */
.btn.acct{display:inline-flex;align-items:center;gap:6px;max-width:150px}
.btn.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.stack{display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--mist);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 10px;font:inherit;font-weight:600;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.memberbox{display:flex;flex-direction:column;gap:2px;background:var(--mist);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.memberbox>span{font-size:12.5px;color:var(--sub)} .memberbox b{font-size:16px} .memberbox small{font-size:13px;color:var(--sub)} .memberbox .faint{color:var(--faint)}

// ===== CORE: data model + rules. Demo mode runs these on a local copy; they mirror sql/02_functions.sql =====
const Core = (function () {
  const LIVE = b => b.status !== 'cancelled' && b.status !== 'noshow';
  const HOLD = b => b.status === 'pending' || b.status === 'confirmed' || b.status === 'inhouse' || b.status === 'out';
  function addD(d, n) { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
  function diffD(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); }
  function dow(d) { return new Date(d + 'T00:00:00Z').getUTCDay(); }
  function monthEnd(m) { return addD(addD(m + '-01', 32).slice(0, 7) + '-01', -1); }
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const digits = s => String(s || '').replace(/\D/g, '');
  const fail = (code, detail) => { const e = new Error(code); e.code = code; e.detail = detail; throw e; };
  const nightsOf = b => diffD(b.ci, b.co);
  let S = null;

  // ---------- helpers ----------
  const role = () => S.me && S.me.role;
  function need(...roles) { const r = role(); if (!r || !(r === 'owner' || roles.includes(r))) fail('permission_denied'); }
  function log(action, ref, detail) {
    S.audit.unshift({ id: S.seq.au++, at: new Date().toISOString(), actor: S.me ? S.me.name : 'website', action, ref, detail: detail || null });
    if (S.audit.length > 1500) S.audit.length = 1500;
  }
  const locked = d => S.locks.includes(d.slice(0, 7));
  function post(date, desc, ref, src, lines, reverses) {
    if (locked(date)) fail('period_locked', date.slice(0, 7));
    lines = lines.map(l => ({ a: l.a, dr: Math.round(l.dr || 0), cr: Math.round(l.cr || 0) })).filter(l => l.dr + l.cr > 0);
    let d = 0, c = 0;
    for (const l of lines) { if (!S.accounts[l.a]) fail('invalid_account', l.a); if (l.dr < 0 || l.cr < 0) fail('unbalanced_entry'); d += l.dr; c += l.cr; }
    if (d !== c || d === 0) fail('unbalanced_entry', 'Dr ' + d + ' Cr ' + c);
    const e = { id: S.seq.je++, date, desc, ref: ref || '', src, rev: reverses || null, revBy: null, at: new Date().toISOString(), lines };
    S.journal.push(e); return e;
  }
  function vatSplit(amount) {
    const r = S.settings.vat / 100;
    if (S.settings.incl) { const vat = Math.round(amount * r / (1 + r)); return { gross: amount, net: amount - vat, vat }; }
    const vat = Math.round(amount * r); return { gross: amount + vat, net: amount, vat };
  }
  const directRate = base => Math.round(base * (1 - S.settings.direct_discount / 100) / 1000) * 1000;
  const payAcc = m => m === 'cash' ? '1110' : '1120';
  const bk = id => S.bookings.find(b => b.id === id) || fail('not_found');
  const roomOf = no => S.rooms.find(r => r.no === no);

  function freeRooms(type, ci, co) { return S.rooms.filter(r => r.type === type && r.active && r.hk !== 'ooo' && roomFree(r.no, ci, co)).map(r => r.no); }
  function checkStay(ci, co) {

  function newGuest(name, phone, email, country) { return { id: 'G' + S.seq.g++, name: String(name).trim(), phone: phone || '', email: email || '', country: country || 'OT' }; }

  // ---------- folio primitives ----------
  function addCharge(b, date, kind, desc, amount) {

    const e = post(date, desc, b.id, 'folio', [{ a: '1130', dr: v.gross }, { a: acc, cr: v.net }, { a: '2140', cr: v.vat }]);
    b.folio.push({ id: S.seq.fl++, date, kind, desc, gross: v.gross, net: v.net, vat: v.vat, voids: null, je: e.id });
  }
  function addPayment(b, date, method, amt, ref) {

    post(date, { k: dep ? 'dep' : 'pay', m: method, g: b.guest.name }, b.id, dep ? 'deposit' : 'payment', [{ a: payAcc(method), dr: amt }, { a: dep ? '2150' : '1130', cr: amt }]);

  function applyDeposits(b, date, mode) {

  function doCheckOut(b, method) {

  // staff must open the slip before approving it, and type the bank transaction reference they matched it to

  const memberView = m => m ? (m.name ? { profile: true, name: m.name, phone: m.phone, email: m.email, country: m.country, since: m.since } : { profile: false, email: m.email }) : null;
  function memberSignUp(email, pw) {

  function memberMe(id) { return memberView(memberOf(id)); }

  function memberBook(id, p) {

      const t = typeOf(p.type); checkStay(p.ci, p.co); expireUnpaid();

      if ((+p.adults || 1) > t.capacity) fail('too_many_guests');
      let pct = 0; if (String(p.promo || '').trim()) { pct = promoPct(p.promo); if (pct == null) fail('promo_invalid'); }
      if (S.bookings.some(b => b.member === id && b.status === 'pending' && b.type === t.id && b.ci === p.ci && b.co === p.co)) fail('duplicate_booking');

      if (!LIVE) { demoMe = Core.get().staff.find(s => s.id === email); try { sessionStorage.setItem(USER_KEY, demoMe.id); } catch (e) { } return demoMe; }
      const c = await client(); const { error } = await c.auth.signInWithPassword({ email, password }); if (error) throw toErr(error);
      const me = await rpc('me'); if (!me) { await c.auth.signOut(); const e = new Error('not_staff'); e.code = 'not_staff'; throw e; } return me;
    },
    async logout() { if (LIVE) { const c = await client(); await c.auth.signOut(); } demoMe = null; try { sessionStorage.removeItem(USER_KEY); } catch (e) { } },
    async snapshot() {
      if (!LIVE) { const s = demoLoad(); s.me = null; const copy = JSON.parse(JSON.stringify(s)); copy.me = demoMe; copy.live = false; return copy; }
      const x = await rpc('admin_snapshot'); const s = normalize(x);
      if (s.me && s.me.role === 'owner') { try { s.staff = await rpc('admin_staff'); } catch (e) { } }
      return s;
    },
    act(name, ...args) {
      if (!LIVE) {
        if (!Core[name]) return Promise.reject(toErr('unknown'));
        return demoRun(() => Core[name](...args), true);
      }
      if (STAFF_RPC[name]) { const [fn, a] = STAFF_RPC[name](...args); return rpc(fn, a); }
      return liveTable({ op: name, arg: args[0] });
    },
    resetDemo: () => { if (!LIVE) demoReset(); },
    asGuest() { guestMode = true; },
    // demo: another tab wrote to this browser's storage. live: poll the database while the page is visible
    onExternalChange(cb, everyMs) {
      if (typeof window === 'undefined') return;
      if (!LIVE) { window.addEventListener('storage', e => { if (e.key === KEY) cb(); }); return; }
      let t = null;
      const tick = () => { if (document.visibilityState === 'visible') cb(); };
      const start = () => { clearInterval(t); t = setInterval(tick, everyMs || 15000); };
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { cb(); start(); } else clearInterval(t); });
      window.addEventListener('focus', () => cb());
      start();
    }
  };
  return pub;
})();

    if (!F.view) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    if (F.view === 'auth') { el.innerHTML = authView(); return; }
    if (F.view === 'account') { el.innerHTML = accountView(); setTimeout(() => F.accSel && drawQR(F.accSel), 0); return; }
    const msg = F.msg ? `<div class="msg bad">${esc(F.msg)}</div>` : '';
    if (F.step === 1) {
      const n = nights(Q.ci, Q.co);
      const list = !F.avail ? `<div class="msg info">${t('loading')}</div>` : CAT.types.map(x => {
        const a = F.avail.find(v => v.type_id === x.id) || { free: 0 }, cap = Q.ad > x.capacity, sold = !a.free || cap;
        return `<button class="opt ${sold ? 'sold' : ''}" ${sold ? 'disabled aria-disabled="true"' : `data-act="pick" data-t="${x.id}"`}><div class="thumb">${roomArt(x.id, true)}</div><div>
          <b>${esc(L(x.name))}</b><div class="row"><span class="tnum">${kip(x.direct_rate)} <small style="color:var(--sub)">/ ${t('night')}</small></span><span class="tnum" style="font-weight:600">${kip(x.direct_rate * n)}</span></div>
          <div class="row"><small style="color:var(--sub)">${t('sleeps', { n: x.capacity })} · ${esc(L(x.bed))}</small>${cap ? `<span class="flag bad">${t('tooMany', { n: x.capacity })}</span>` : !a.free ? `<span class="flag bad">${t('soldOut')}</span>` : a.free <= 2 ? `<span class="flag">${t('left', { n: a.free })}</span>` : `<span class="flag ok">${t('available')}</span>`}</div></div></button>`;
      }).join('');
      el.innerHTML = sheetShell(t('bookNow'), `<div class="mini"><label class="field"><span>${t('arrive')}</span><input class="in" type="date" id="f_ci" value="${Q.ci}" min="${CAT.hotel.business_date}"></label>
        <label class="field"><span>${t('depart')}</span><input class="in" type="date" id="f_co" value="${Q.co}" min="${addD(Q.ci, 1)}"></label>
        <label class="field"><span>${t('guests')}</span><select class="in" id="f_ad">${[1, 2, 3, 4].map(v => `<option ${v === Q.ad ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>${msg}${list}`, '', 1);
      return;
    }
    if (F.step === 4) { el.innerHTML = stepDone(msg); drawQR(F.result.code); return; }
    const q = quote();
    if (F.step === 2) {
      el.innerHTML = sheetShell(t('bookNow'), `<div class="summary"><span class="k">${t('room')}</span><span class="v">${esc(L(q.x.name))} · <button class="linkbtn" data-act="step" data-s="1">${t('changeRoom')}</button></span></div>
        <div class="mini"><label class="field"><span>${t('arrive')}</span><input class="in" type="date" id="f_ci" value="${Q.ci}" min="${CAT.hotel.business_date}"></label>
          <label class="field"><span>${t('depart')}</span><input class="in" type="date" id="f_co" value="${Q.co}" min="${addD(Q.ci, 1)}"></label>
          <label class="field"><span>${t('guests')}</span><select class="in" id="f_ad">${Array.from({ length: q.x.capacity }, (_, i) => i + 1).map(v => `<option ${v === Q.ad ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
        <div class="tnum" style="font-size:13px;color:var(--sub);margin-top:-6px">${q.n} ${t('nights')} · ${kip(q.rate)} / ${t('night')}${F.checking ? ' · ' + t('loading') : ''}</div>
        <div class="memberbox"><span>${t('bookedAs')}</span><b>${esc(ME.name)}</b><small>${esc(ME.phone)} · ${esc(ME.email || '')}</small><small class="faint">${t('profileNote')} · <button class="linkbtn" data-act="editProfile">${t('editProfile')}</button></small></div>
        <label class="field"><span>${t('request')}</span><textarea class="in" id="f_req" rows="2" placeholder="${esc(t('requestPh'))}">${esc(F.request)}</textarea></label>
        <div class="field"><span>${t('promo')}</span><div style="display:flex;gap:8px"><input class="in" id="f_promo" value="${esc(F.promo)}" autocomplete="off" style="text-transform:uppercase"><button class="btn" data-act="promo">${t('apply')}</button></div>
          ${F.promoPct ? `<div class="msg ok">${t('promoOk', { p: pct(F.promoPct) })}</div>` : ''}</div>${msg}`,
        `<div class="sum">${t('total')}<b>${kip(q.total)}</b></div><button class="btn" data-act="step" data-s="1">${t('back')}</button><button class="btn cta" data-act="toReview">${t('next')}</button>`, 2);
      return;
    }
    // step 3: review — full prepayment and the cancellation deadline for this exact stay
    const dl = deadlineFor(Q.ci), late = Date.now() >= dl.getTime(), rp = refundPct();
    el.innerHTML = sheetShell(t('bookNow'), `<div class="summary">
        <span class="k">${t('room')}</span><span class="v">${esc(L(q.x.name))}</span>
        <span class="k">${t('stay')}</span><span class="v">${dfm(Q.ci)} → ${dfm(Q.co)}</span>
        <span class="k">${t('guestL')}</span><span class="v">${esc(ME.name)} · ${Q.ad} ${t('guests').toLowerCase()}</span>
        <span class="k">${kip(q.rate)} × ${q.n} ${t('nights')}</span><span class="v">${kip(q.total)}</span>
        ${F.promoPct ? `<span class="k">${t('promo')} ${esc(F.promo)}</span><span class="v">−${pct(F.promoPct)}</span>` : ''}
        <span class="k tot">${t('payFullRow')}</span><span class="v tot">${kip(q.total)}</span></div>
      <ul class="pol"><li>${t('pol_full')}</li><li>${t('pol_cancel2', { h: CAT.hotel.cancel_cutoff_hours ?? 3, p: pct(rp), f: pct(100 - rp) })}</li>
        <li>${t('pol_in', { t: CAT.hotel.check_in_time })} · ${t('pol_out', { t: CAT.hotel.check_out_time })}</li></ul>
      ${late ? `<div class="msg warn">${t('noCancelSoon')}</div>` : `<div class="msg info">${t('cxlUntilT', { t: fmtTs(dl) })}</div>`}
      <label class="check"><input type="checkbox" id="f_agree" ${F.agree ? 'checked' : ''}> ${t('agree')}</label>${msg}`,
      `<div class="sum">${t('total')}<b>${kip(q.total)}</b></div><button class="btn" data-act="step" data-s="2">${t('back')}</button><button class="btn cta" data-act="confirm" ${F.busy ? 'disabled' : ''}>${t('confirmBook')}</button>`, 3);
  }

  // step 4: the request exists but is only a booking once staff have seen the money
  function stepDone(msg) {
    const r = F.result, d = F.trk || { code: r.code, status: r.status || 'pending', total: r.total, paid: 0, pending_claims: 0, claims: [] };
    const v = trackView(d, 'claim', 'closeSheet', t('payLater'));

  // one status view for the confirmation step and for a booking opened from "my bookings"
  function trackView(d, claimAct, backAct, backLabel) {
    const due = dueOf(d), waiting = d.pending_claims > 0, done = isDone(d), dead = d.status === 'cancelled' || d.status === 'noshow';
    const needPay = d.status === 'pending' && due > 0 && !F.slipJustSent;
    const trk = dead ? '' : `<ol class="trk"><li class="done">${t('trk1')}</li><li class="${done || waiting ? 'done' : 'now'}">${t('trk2')}</li><li class="${done ? 'done' : waiting ? 'now' : ''}">${t('trk3')}</li></ol>`;
    let banner;
    if (done) banner = `<div class="msg ok big">${t('bookedOk')}</div><p style="margin:0">${t('seeYou', { h: esc(CAT.hotel.name) })}</p>`;
    else if (dead) {
      const why = d.cancel_reason === 'guest_cancelled' ? 'youCancelled' : d.cancel_reason === 'declined_by_staff' ? 'declinedMsg' : d.cancel_reason ? 'expiredMsg' : 'st_' + d.status;
      banner = `<div class="msg bad">${t(why, { p: esc(CAT.hotel.phone || '') })}</div>`;
      if (d.refund && d.refund.amount > 0) banner += `<div class="msg ${d.refund.status === 'paid' ? 'ok' : 'info'}">${t(d.refund.status === 'paid' ? 'refundDone' : 'refundOwed', { a: kip(d.refund.amount) })}${d.refund.fee ? ' · ' + t('feeKept', { a: kip(d.refund.fee) }) : ''}</div>`;
    }
    else if (waiting && !needPay) banner = `<div class="msg info">${t('waitStaff')}</div>`;
    else banner = `<div class="msg warn">${t('notYet', { u: d.hold_until ? t('holdUntil', { t: fmtTs(d.hold_until) }) : '' })}</div>${lastClaim(d) === 'rejected' ? `<div class="msg bad">${t('slipRejected', { p: esc(CAT.hotel.phone || '') })}</div>` : ''}`;
    const body = `${trk}${banner}${needPay ? payBlock(due, d.code) : ''}`;
    const foot = needPay
      ? `<button class="btn" data-act="${backAct}">${backLabel}</button><button class="btn cta" data-act="${claimAct}" ${F.busy || !F.slipBlob ? 'disabled' : ''}>${F.busy ? t('sending') : t('sendRef')}</button>`
      : !done && !dead ? `<button class="btn" data-act="${backAct}">${backAct === 'closeSheet' ? t('close') : backLabel}</button><button class="btn cta" data-act="refresh" ${F.busy ? 'disabled' : ''}>${t('refresh')}</button>`
      : `<button class="btn cta block" data-act="${backAct}">${backAct === 'closeSheet' ? t('done') : backLabel}</button>`;
    return { body, foot };
  }

      return sheetShell(t('myBookings'), `<button class="linkbtn" data-act="accBack" style="align-self:flex-start">${t('allBookings')}</button>

        <span class="k">${t('room')}</span><span class="v">${esc(L(d.type))}</span><span class="k">${t('stay')}</span><span class="v">${dfm(d.ci)} → ${dfm(d.co)} · ${d.nights} ${t('nights')}</span>
        <span class="k">${t('bookedOn')}</span><span class="v">${fmtTs(d.created)}</span>

        ${d.pending_claims ? `<span class="k">${t('checking')}</span><span class="v">${kip(d.pending_claims)}</span>` : ''}</div>

  function payBlock(amount, code) {
    const qr = CAT.hotel.payment_qr_url || (window.HOTEL_CONFIG && window.HOTEL_CONFIG.paymentQrImage) || '';
    const qrBox = qr
      ? `<div class="qrimg"><img src="${esc(qr)}" alt="QR" loading="eager"><a class="linkbtn" href="${esc(qr)}" target="_blank" rel="noopener" download>${t('saveQr')}</a></div>`
      : API.live ? `<div class="qrmissing">${t('qrMissing', { p: esc(CAT.hotel.phone || '') })}</div>`
      : `<div class="qrimg"><canvas id="qrc" width="29" height="29" aria-label="QR"></canvas></div>`;
    const slip = F.slipPreview
      ? `<div class="slipok"><img src="${F.slipPreview}" alt=""><div><b>${t('slipReady')}</b><small>${esc(F.slipName)}</small><label class="linkbtn" for="f_slip">${t('slipChange')}</label></div></div>`
      : `<label class="slipdrop" for="f_slip"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><b>${t('slipPick')}</b><small>${t('slipHint')}</small></label>`;
    return `<h3 style="font-size:19px">${t('payNowT', { a: kip(amount) })}</h3>
      <div class="qr">${qrBox}<div class="txt"><span class="amt">${kip(amount)}</span><span>${esc(L(CAT.hotel.payment_note))}</span>${!qr && !API.live ? `<small style="color:var(--faint)">${t('qrSample')}</small>` : ''}</div></div>
      <div class="field"><span>${t('slipLabel')}</span>${slip}<input type="file" id="f_slip" class="vh" accept="image/*"></div>
      ${F.slipBusy ? `<div class="msg info">${t('slipPreparing')}</div>` : ''}`;
  }
  // phone photos are often 5–12 MB: shrink to a sharp, readable JPEG before upload
  async function shrinkImage(file, maxDim) {
    if (!file) throw Object.assign(new Error('slip_type'), { code: 'slip_type' });
    if (file.size > 25 * 1048576) throw Object.assign(new Error('slip_big'), { code: 'slip_big' });
    let src;
    try { src = await createImageBitmap(file); }
    catch (e) {
      src = await new Promise((ok, no) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => ok(i); i.onerror = () => no(Object.assign(new Error('slip_type'), { code: 'slip_type' })); i.src = u; });
    }
    const w = src.width, h = src.height, k = Math.min(1, maxDim / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(src, 0, 0, c.width, c.height);
    let q = 0.85, blob;
    do { blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', q)); q -= 0.15; } while (blob && blob.size > 4.5 * 1048576 && q > 0.3);
    if (!blob) throw Object.assign(new Error('slip_type'), { code: 'slip_type' });
    return blob;
  }
  function clearSlip() { if (F.slipPreview) URL.revokeObjectURL(F.slipPreview); F.slipBlob = null; F.slipPreview = ''; F.slipName = ''; }
  function drawQR(seed) {
    const c = document.getElementById('qrc'); if (!c) return; const g = c.getContext('2d');
    let h = 0; for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) | 0;
    const R = (function (a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })(h);
    g.fillStyle = '#fff'; g.fillRect(0, 0, 29, 29); g.fillStyle = '#122220';
    for (let y = 0; y < 29; y++) for (let x = 0; x < 29; x++) if (R() < .46) g.fillRect(x, y, 1, 1);
    [[0, 0], [22, 0], [0, 22]].forEach(([x, y]) => { g.fillStyle = '#122220'; g.fillRect(x, y, 7, 7); g.fillStyle = '#fff'; g.fillRect(x + 1, y + 1, 5, 5); g.fillStyle = '#122220'; g.fillRect(x + 2, y + 2, 3, 3); });
  }
  // ---------- actions ----------
  async function loadAvail(keepMsg) {
    F.avail = null; if (!keepMsg) F.msg = ''; renderSheet();
    try { F.avail = await API.availability(Q.ci, Q.co); } catch (e) { F.avail = []; F.msg = errText(e); }
    renderSheet();
  }
  function lockScroll(on) { document.body.style.overflow = on ? 'hidden' : ''; }
  // booking always starts from a member account: no account, no booking
  function openBooking(typeId) {
    if (!isMember()) { openAuth('book', typeId); return; }
    clearSlip(); Object.assign(F, { view: 'book', step: 1, sel: null, result: null, trk: null, claimed: false, msg: '', agree: false, slipJustSent: false });
    lockScroll(true);
    loadAvail().then(() => {
      if (typeId) { const a = F.avail.find(v => v.type_id === typeId), x = CAT.types.find(y => y.id === typeId); if (a && a.free && Q.ad <= x.capacity) { F.sel = typeId; F.step = 2; renderSheet(); } }
    });
  }
  function openAuth(reason, typeId) {
    // new visitors arriving from "book" most likely need an account; the header button is for returning members
    let known = false; try { known = !!localStorage.getItem('saynam-member-known'); } catch (e) { }
    Object.assign(F, { view: 'auth', authReason: reason || null, afterType: typeId || null, authMsg: null, authTab: reason === 'book' && !known ? 'signup' : 'login' });
    lockScroll(true); renderSheet();
  }
  async function openAccount(code) {
    if (!isMember()) { openAuth('view'); return; }
    clearSlip(); Object.assign(F, { view: 'account', accSel: code || null, accMsg: null, cxlAsk: null, slipJustSent: false });
    lockScroll(true); renderSheet();
    await loadMine(); renderSheet(); startPoll();
  }
  async function loadMine() { try { F.myList = await API.member.bookings(); } catch (e) { F.accMsg = { k: 'bad', t: esc(errText(e)) }; if (e.code === 'login_required') { ME = null; render(); } } }
  function afterLogin() {
    try { localStorage.setItem('saynam-member-known', '1'); } catch (e) { }
    render();
    if (!isMember()) { F.view = 'auth'; F.authTab = 'profile'; renderSheet(); return; }
    if (F.authReason === 'book') { const ty = F.afterType; F.authReason = null; openBooking(ty); }
    else openAccount();
  }
  // dates changed while on the details step: keep the chosen room if it is still free
  async function recheckSelected() {
    F.checking = true; F.msg = ''; renderSheet();
    let av = [];
    try { av = await API.availability(Q.ci, Q.co); } catch (e) { F.checking = false; F.msg = errText(e); renderSheet(); return; }
    F.checking = false; F.avail = av;
    const a = av.find(v => v.type_id === F.sel);
    if (!a || !a.free) { F.step = 1; F.msg = t('selNotFree'); }
    renderSheet();
  }
  function syncSearchBar() {
    const ci = $('#q_ci'), co = $('#q_co'), ad = $('#q_ad'), n = $('#q_n');
    if (ci) ci.value = Q.ci; if (co) co.value = Q.co; if (ad) ad.value = String(Math.min(4, Q.ad));
    if (n) n.textContent = `${nights(Q.ci, Q.co)} ${t('nights')} · ${dfm(Q.ci)} → ${dfm(Q.co)}`;
  }
  // while a member looks at a booking that waits for staff, re-check quietly so "booking confirmed" appears as soon as staff approve it
  let pollT = null;
  const pollCode = () => F.view === 'account' && F.accSel ? F.accSel : F.view === 'book' && F.step === 4 && F.result ? F.result.code : null;
  const findMine = code => (F.myList || []).find(x => x.code === code) || null;
  async function pollOnce() {
    const code = pollCode(); if (!code) return false;
    const before = F.view === 'book' ? F.trk : findMine(code);
    let list; try { list = await API.member.bookings(); } catch (e) { return false; }
    if (pollCode() !== code) return false;
    F.myList = list; const x = findMine(code); if (!x) return false;
    if (F.view === 'book') F.trk = x;
    const changed = !before || before.status !== x.status || before.pending_claims !== x.pending_claims || before.paid !== x.paid || lastClaim(before) !== lastClaim(x);
    if (changed && x.pending_claims === 0) F.slipJustSent = false;
    return changed;
  }
  function startPoll() {
    clearInterval(pollT);
    pollT = setInterval(async () => {
      const code = pollCode(); if (!code) { if (!F.view) clearInterval(pollT); return; }
      const d = F.view === 'book' ? F.trk : findMine(code);
      if (d && (isDone(d) || d.status === 'cancelled' || d.status === 'noshow')) return;
      if (document.hidden || F.busy || F.slipBlob || F.cxlAsk) return;      // never redraw while the guest is choosing a slip or confirming a cancel
      if (await pollOnce()) { renderSheet(); const n = F.view === 'book' ? F.trk : findMine(code); toast(n && isDone(n) ? t('booked') : t('updated')); }
    }, 15000);
  }
  function closeSheet() { clearInterval(pollT); F.view = null; F.cxlAsk = null; lockScroll(false); renderSheet(); }
  function readDetails() {
    const g = id => (document.getElementById(id) || {}).value;
    if (document.getElementById('f_req')) { F.request = g('f_req'); F.promo = String(g('f_promo') || '').trim().toUpperCase(); }
  }
  function readAuth() { const g = id => (document.getElementById(id) || {}).value; F.aName = (g('a_name') ?? F.aName ?? '').trim(); F.aPhone = (g('a_phone') ?? F.aPhone ?? '').trim(); F.aCountry = g('a_country') || F.aCountry; F.aEmail = (g('a_email') ?? F.aEmail ?? '').trim(); }
  let toastT;
  function toast(m) { const el = $('#toast'); el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2400); }
  async function sendSlip(code, amount) {
    if (!F.slipBlob) throw Object.assign(new Error('slip_required'), { code: 'slip_required' });
    const ref = await API.uploadSlip(code, F.slipBlob);
    await API.member.claim(code, amount, ref);
    clearSlip();
  }
  const A = {
    lang: d => { lang = d.l; try { localStorage.setItem('saynam-lang', lang); } catch (e) { } render(); },
    book: d => openBooking(d.t),
    closeSheet,
    account: () => openAccount(),
    manage: () => openAccount(),
    login: () => openAuth(null),
    authTab: d => { readAuth(); F.authTab = d.t; F.authMsg = null; renderSheet(); },
    doLogin: async () => {
      readAuth(); const pw = $('#a_pw').value; F.busy = true; F.authMsg = null; renderSheet();
      try { ME = await API.member.signIn(F.aEmail, pw); F.busy = false; toast(t('signedIn')); afterLogin(); return; }
      catch (e) { F.authMsg = { k: 'bad', t: esc(errText(e)) }; }
      F.busy = false; renderSheet();
    },
    doSignup: async () => {
      readAuth(); const pw = $('#a_pw').value, pw2 = $('#a_pw2').value;
      const bad = F.aName.length < 2 ? 'e_name_required' : F.aPhone.replace(/\D/g, '').length < 8 ? 'e_phone_required' : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.aEmail) ? 'e_email_invalid' : pw.length < 6 ? 'e_weak_password' : pw !== pw2 ? 'e_pw_mismatch' : '';
      if (bad) { F.authMsg = { k: 'bad', t: t(bad) }; renderSheet(); return; }
      F.busy = true; F.authMsg = null; renderSheet();
      try { ME = await API.member.signUp(F.aEmail, pw, F.aName, F.aPhone, F.aCountry || 'LA'); F.busy = false; toast(t('signedIn')); afterLogin(); return; }
      catch (e) { F.authMsg = e.code === 'confirm_email' ? { k: 'ok', t: t('confirmEmailSent', { e: esc(F.aEmail) }) } : { k: 'bad', t: esc(errText(e)) }; if (e.code === 'confirm_email') F.authTab = 'login'; }
      F.busy = false; renderSheet();
    },
    editProfile: () => { F.view = 'auth'; F.authTab = 'profile'; F.authMsg = null; lockScroll(true); renderSheet(); },
    saveProfile: async () => {
      readAuth(); F.busy = true; F.authMsg = null; renderSheet();
      try { ME = await API.member.register(F.aName, F.aPhone, F.aCountry || 'LA'); F.busy = false; F.authTab = 'login'; toast(t('saved')); afterLogin(); return; }
      catch (e) { F.authMsg = { k: 'bad', t: esc(errText(e)) }; }
      F.busy = false; renderSheet();
    },
    logout: async () => { try { await API.member.signOut(); } catch (e) { } ME = null; F.myList = null; closeSheet(); render(); toast(t('signedOut')); },
    pick: d => { F.sel = d.t; F.step = 2; F.msg = ''; renderSheet(); },
    step: d => { readDetails(); F.step = +d.s; F.msg = ''; if (F.step === 1 && !F.avail) loadAvail(); else renderSheet(); },
    promo: async () => {
      readDetails(); F.msg = ''; F.promoPct = 0;
      if (F.promo) { try { const p = await API.promo(F.promo); if (p == null) F.msg = t('e_promo_invalid'); else F.promoPct = +p; } catch (e) { F.msg = errText(e); } }
      renderSheet();
    },
    toReview: async () => {
      readDetails(); F.msg = '';
      if (F.promo && !F.promoPct) { try { const p = await API.promo(F.promo); if (p == null) F.msg = t('e_promo_invalid'); else F.promoPct = +p; } catch (e) { F.msg = errText(e); } }
      if (!F.msg && !F.promo) F.promoPct = 0;
      if (!F.msg) F.step = 3; renderSheet();
    },
    confirm: async () => {
      F.agree = $('#f_agree').checked; if (!F.agree) { F.msg = t('e_agree'); renderSheet(); return; }
      if (F.busy) return;                                    // a second tap must never send a second booking
      F.busy = true; F.msg = ''; renderSheet();
      try {
        F.result = await API.member.book({ ci: Q.ci, co: Q.co, type: F.sel, adults: Q.ad, request: F.request, promo: F.promo }); F.step = 4;
        F.trk = null; F.slipJustSent = false; await loadMine(); F.trk = findMine(F.result.code);
        startPoll();
      }
      catch (e) { F.msg = errText(e); if (e.code === 'sold_out') { F.step = 1; F.busy = false; loadAvail(); return; } if (e.code === 'login_required') { ME = null; F.busy = false; openAuth('book', F.sel); return; } }
      F.busy = false; renderSheet();
    },
    claim: async () => {
      if (F.busy) return; F.busy = true; F.msg = ''; renderSheet();
      try { await sendSlip(F.result.code, dueOf(F.trk || F.result)); F.claimed = true; F.slipJustSent = true; await loadMine(); F.trk = findMine(F.result.code) || F.trk; } catch (e) { F.msg = errText(e); }
      F.busy = false; renderSheet();
    },
    accOpen: d => { clearSlip(); F.accSel = d.c; F.cxlAsk = null; F.accMsg = null; F.slipJustSent = false; renderSheet(); startPoll(); },
    accBack: () => { clearSlip(); F.accSel = null; F.cxlAsk = null; F.accMsg = null; renderSheet(); },
    accClaim: async () => {
      const d = findMine(F.accSel); if (!d || F.busy) return; F.busy = true; F.accMsg = null; renderSheet();
      try { await sendSlip(d.code, dueOf(d)); F.slipJustSent = true; await loadMine(); F.accMsg = { k: 'ok', t: t('claimSent') }; } catch (e) { F.accMsg = { k: 'bad', t: esc(errText(e)) }; }
      F.busy = false; renderSheet();
    },
    cxlAsk: d => { F.cxlAsk = d.c; renderSheet(); },
    cxlNo: () => { F.cxlAsk = null; renderSheet(); },
    cxlYes: async d => {
      if (F.busy) return; F.busy = true; renderSheet();
      try { const r = await API.member.cancel(d.c); F.accMsg = { k: 'ok', t: r.refund > 0 ? t('cxlDone', { r: kip(r.refund) }) : t('cxlDoneFree') }; }
      catch (e) { F.accMsg = { k: 'bad', t: esc(errText(e)) }; }
      F.cxlAsk = null; await loadMine(); F.busy = false; renderSheet();
    },
    refresh: async () => { F.busy = true; renderSheet(); const ch = await pollOnce(); F.busy = false; renderSheet(); if (!ch) { const x = F.view === 'book' ? F.trk : findMine(pollCode()); toast(t('st_' + ((x || {}).status || 'pending'))); } },
    copy: (d) => { try { navigator.clipboard.writeText(d.v).then(() => toast(t('copied')), () => toast(d.v)); } catch (e) { toast(d.v); } }
  };
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset, el); } });
  document.addEventListener('submit', e => {
    if (e.target.id === 'sform') { e.preventDefault(); readSearch(); openBooking(); }
    if (e.target.id === 'loginForm') { e.preventDefault(); A.doLogin(); }
    if (e.target.id === 'signupForm') { e.preventDefault(); A.doSignup(); }
  });
  function readSearch() {
    const ci = $('#q_ci').value, co = $('#q_co').value; Q.ad = +$('#q_ad').value;
    if (ci) Q.ci = ci; if (co) Q.co = co; if (Q.co <= Q.ci) Q.co = addD(Q.ci, 1);
  }
  document.addEventListener('change', async e => {
    const id = e.target.id;
    if (id === 'f_slip') {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      F.slipBusy = true; F.msg = ''; renderSheet();
      try { const blob = await shrinkImage(file, API.live ? 1600 : 900); clearSlip(); F.slipBlob = blob; F.slipPreview = URL.createObjectURL(blob); F.slipName = file.name; }
      catch (er) { const m = errText(er); if (F.view === 'account') F.accMsg = { k: 'bad', t: esc(m) }; else F.msg = m; }
      F.slipBusy = false; renderSheet(); return;
    }
    if (id === 'q_ci' || id === 'q_co' || id === 'q_ad') { if (id === 'q_ci') { const stay = Math.max(1, nights(Q.ci, Q.co)); Q.ci = $('#q_ci').value || Q.ci; $('#q_co').value = addD(Q.ci, stay); } readSearch(); const n = $('#q_n'); if (n) n.textContent = `${nights(Q.ci, Q.co)} ${t('nights')} · ${dfm(Q.ci)} → ${dfm(Q.co)}`; if (id === 'q_ci') $('#q_co').value = Q.co; }
    if (id === 'f_ci' || id === 'f_co' || id === 'f_ad') {
      if (F.step === 2) readDetails();
      const stay = Math.max(1, nights(Q.ci, Q.co));
      Q.ci = $('#f_ci').value || Q.ci; Q.co = $('#f_co').value || Q.co; Q.ad = +$('#f_ad').value;
      if (Q.ci < CAT.hotel.business_date) Q.ci = CAT.hotel.business_date;
      if (id === 'f_ci' || Q.co <= Q.ci) Q.co = addD(Q.ci, stay);   // moving check-in keeps the length of stay
      syncSearchBar();
      if (F.step === 2) recheckSelected(); else loadAvail();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && F.view) closeSheet(); });

  // ---------- boot ----------
  (async function boot() {
    API.asGuest();
    try { CAT = await API.catalog(); } catch (e) { $('#app').innerHTML = `<div class="wrap" style="padding-block:60px"><div class="msg bad">${esc(errText(e))}</div></div>`; return; }
    Q.ci = addD(CAT.hotel.business_date, 2); Q.co = addD(Q.ci, 2);
    try { ME = await API.member.session(); ME = await API.member.finishPending(ME); } catch (e) { ME = null; }
    render();
    if (ME && !ME.profile) { F.view = 'auth'; F.authTab = 'profile'; lockScroll(true); renderSheet(); }
    else if (location.hash === '#book') openBooking(); else if (/^#(manage|account)/.test(location.hash)) openAccount();
  })();
})();

</script>
</body>
